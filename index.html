:root{--bg:#FFFFFF;--card:#fff;--blue:#232F3E;--orange:#FF9900;--green:#067D62; --red:#B12704; --yellow:#FFD814; --text:#0F1111}
body.dark{--bg:#131921;--card:#232F3E;--text:#fff}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
body{background:var(--bodyBg, var(--bg)) center/cover fixed;color:var(--text);padding-bottom:70px}

.top-header{background:var(--headerBg, var(--blue));background-size:cover;background-position:center;padding:10px;color:#fff;position:sticky;top:0;z-index:999}
.brand-row{display:flex;justify-content:space-between;align-items:center}
.brand-name{font-weight:900;font-size:1.4rem;color:var(--orange)}
.whatsapp-top{background:#25D366;color:#fff;border:none;padding:8px 12px;border-radius:8px;font-weight:700;cursor:pointer;font-size:0.9rem}
.search-area{display:flex;gap:0;padding:10px 0 0 0;position:relative}
.search-icon{background:var(--orange);padding:0 10px;display:flex;align-items:center;border-radius:0 8px 8px 0;font-size:1.1rem;cursor:pointer}
.search-area input{flex:1;padding:10px;border:none;outline:none;font-size:0.95rem;border-radius:8px 0 0 8px}

.section-title{background:var(--card);padding:15px;font-size:1.3rem;font-weight:900;text-align:center;border-bottom:1px solid #ddd;color:var(--text)}

.categories-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:10px;background:var(--card)}
@media(min-width:768px){.categories-grid{grid-template-columns:repeat(4,1fr);}}
.cat-card{background:var(--bg);border:1px solid #ddd;border-radius:10px;padding:10px;text-align:center;position:relative;cursor:pointer;transition:0.2s}
.cat-card:hover{transform:translateY(-3px);box-shadow:0 4px 10px #0002}
.cat-card img{width:100%;height:100px;object-fit:contain;border-radius:8px;margin-bottom:8px;background:#fff;padding:10px}
.cat-card h3{font-size:1rem;color:var(--text);font-weight:900}
.notification{position:absolute;top:5px;right:5px;background:var(--red);color:#fff;border-radius:50%;width:22px;height:22px;font-size:0.75rem;display:flex;align-items:center;justify-content:center;font-weight:900}

.products-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:10px;background:var(--card)}
@media(min-width:768px){.products-grid{grid-template-columns:repeat(4,1fr);}}
.product-card{background:var(--bg);border:1px solid #ddd;border-radius:8px;padding:10px;text-align:center;position:relative}
.product-card img{width:100%;height:140px;object-fit:contain;margin-bottom:8px}
.product-name{font-size:0.9rem;height:40px;overflow:hidden;text-align:right}
.product-price{color:var(--red);font-weight:900;font-size:1.1rem;text-align:right}
.add-cart-btn{background:var(--yellow);border:none;width:100%;padding:8px;border-radius:20px;margin-top:8px;font-weight:700;cursor:pointer;color:#000}
.add-product-in-cat{background:var(--green);color:#fff;border:none;padding:12px;width:95%;margin:10px auto;display:block;border-radius:10px;font-weight:900;cursor:pointer}

.card-admin{position:absolute;top:5px;left:5px;display:flex;gap:4px;z-index:10;flex-wrap:wrap;width:90px}
.card-admin button{background:var(--yellow);color:#000;border:none;border-radius:6px;width:28px;height:28px;cursor:pointer;font-size:0.8rem}
.card-admin.del{background:var(--red);color:#fff}
.back-btn{background:var(--blue);color:#fff;border:none;padding:10px 15px;border-radius:8px;margin:10px;cursor:pointer}

.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid #ddd;display:flex;justify-content:space-around;padding:8px 0;z-index:998}
.nav-item{text-align:center;font-size:0.8rem;color:var(--text);cursor:pointer;position:relative}
.nav-item i{font-size:1.5rem;display:block;margin-bottom:3px}
.cart-count{position:absolute;top:-5px;right:15px;background:var(--red);color:#fff;border-radius:50%;width:18px;height:18px;font-size:0.7rem;display:flex;align-items:center;justify-content:center;font-weight:900}

#sideMenu{display:none;position:fixed;top:0;right:0;width:300px;height:100%;background:var(--card);z-index:10001;padding:20px;border-left:2px solid var(--orange)}

#sideMenu h3{color:var(--orange);margin:15px 0}
#sideMenu button{width:100%;padding:12px;margin:8px 0;border:none;border-radius:8px;background:var(--blue);color:#fff;font-weight:700;cursor:pointer;text-align:right}
.overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#000aa;z-index:10000}
.overlay.show{display:block}

#adminPanel{position:fixed;top:0;left:-450px;width:450px;height:100%;background:#232F3E;z-index:99999;overflow-y:auto;padding:20px;border-right:3px solid var(--orange);transition:left 0.4s ease;color:#fff}

.admin-toggle{position:fixed;top:50%;left:0;background:var(--orange);color:#000;border:none;padding:15px 8px;border-radius:0 10px 10px 0;font-size:1.5rem;cursor:pointer;z-index:100000;display:none}
.admin-toggle.show{display:block}
.admin-box h2{color:var(--orange);text-align:center;margin-bottom:15px}
.admin-section{border:1px solid #555;padding:15px;border-radius:10px;margin:15px 0}
.admin-box input,.admin-box select{width:100%;padding:10px;margin:8px 0;border-radius:8px;border:1px solid var(--orange);background:#131921;color:#fff}
.admin-box button{padding:10px;border:none;border-radius:8px;font-weight:700;cursor:pointer;width:100%;margin:5px 0}
.color-picker{width:100%;height:40px;border:none;border-radius:8px;cursor:pointer}
.preview-img{width:80px;height:80px;border-radius:8px;object-fit:cover;margin:5px;border:2px solid var(--orange)}

.modal-box{background:var(--card);width:95%;max-width:500px;padding:20px;border-radius:15px;max-height:90vh;overflow-y:auto;color:var(--text)}

<body>

<div class="top-header" id="topHeader">
  <div class="brand-row">
    <div class="brand-name"><i class="fa-solid fa-microchip"></i> مركز اوسكار التقني</div>
    <button class="whatsapp-top" onclick="window.open('https://wa.me/+971544066811','_blank')"><i class="fa-brands fa-whatsapp"></i> تواصل</button>
  </div>
  <div class="search-area">
    <div class="search-icon" onclick="searchProduct()"><i class="fa-solid fa-magnifying-glass"></i></div>

  </div>
</div>

<div id="mainContent">

  <h2 class="section-title">خصومات كبيرة لك</h2>
  <div id="productsGrid" class="products-grid"></div>
</div>

<div id="categoryPage" style="display:none">

  <h2 class="section-title" id="catPageTitle"></h2>
  <button class="add-product-in-cat" style="display:none" id="addProductBtn" onclick="quickAddToCurrentCat()"><i class="fa-solid fa-plus"></i> اضافة منتج لهذا القسم</button>
  <div id="brandGrid" class="categories-grid" style="display:none"></div>
  <div id="catProductsGrid" class="products-grid"></div>
</div>

<div class="overlay" id="overlay" onclick="toggleMenu()"></div>
<div id="sideMenu">

  <button onclick="toggleTheme()"><i class="fa-solid fa-circle-half-stroke"></i> الوضع الليلي / النهاري</button>
</div>

<div class="bottom-nav">

  <div class="nav-item" onclick="openAccount()"><i class="fa-solid fa-user"></i>حسابي</div>

<div id="cartModal">

</div>

<div id="accountModal">

      <button onclick="logout()" style="background:var(--red);color:#fff;width:100%;padding:12px;border:none;border-radius:8px">تسجيل خروج</button>
      <button onclick="closeAccount()" style="background:#888;color:#fff;width:100%;padding:12px;border:none;border-radius:8px;margin-top:10px">اغلاق</button>
    </div>
    <div id="guestView">
      <div style="display:flex;gap:5px;margin-bottom:15px">
        <button id="tabLogin" class="active" onclick="showLogin()" style="flex:1;padding:10px;border:none;border-radius:8px;background:var(--orange);color:#000;font-weight:700">تسجيل دخول</button>
        <button id="tabRegister" onclick="showRegister()" style="flex:1;padding:10px;border:none;border-radius:8px;background:#ddd;cursor:pointer;font-weight:700">انشاء حساب</button>
      </div>
      <div id="loginForm">
        <input type="text" id="loginUser" placeholder="الايميل او رقم الجوال">
        <input type="password" id="loginPass" placeholder="كلمة السر">
        <button onclick="login()" style="background:var(--green);color:#fff;width:100%;padding:12px;border:none;border-radius:8px">دخول</button>
      </div>
      <div id="registerForm" style="display:none">
        <input type="text" id="regName" placeholder="الاسم الكامل">
        <input type="text" id="regUser" placeholder="الايميل او رقم الجوال">
        <input type="password" id="regPass" placeholder="كلمة السر">
        <button onclick="register()" style="background:var(--orange);color:#000;width:100%;padding:12px;border:none;border-radius:8px">انشاء حساب</button>
      </div>
      <button onclick="closeAccount()" style="background:var(--red);color:#fff;width:100%;padding:10px;border:none;border-radius:8px;margin-top:10px">اغلاق</button>
    </div>
  </div>
</div>

<button id="adminToggleBtn" class="admin-toggle" onclick="toggleAdminPanel()"><i class="fa-solid fa-chevron-right"></i></button>

<div id="adminPanel">
  <div class="admin-box">
    <h2><i class="fa-solid fa-user-shield"></i> لوحة التحكم</h2>
    <button onclick="closeAdminPanel()" style="background:var(--red)">اغلاق</button>

    <div class="admin-section">

      <input type="text" id="productName" placeholder="اسم المنتج">

      <label>صورة المنتج من الجهاز:</label>

      <img id="prodPreview" class="preview-img" style="display:none">

    <div class="admin-section">
      <h3>تغيير الالوان</h3>
      <label>لون الخلفية الرئيسية:</label>

    <div class="admin-section">
      <h3>النسخ الاحتياطي</h3>
      <button onclick="exportData()" style="background:var(--blue)">تصدير البيانات</button>
    </div>

    <button onclick="resetData()" style="background:var(--red)">ارجاع الافتراضي</button>
  </div>
</div>

function previewFile(input, previewId){
  const file = input.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    document.getElementById(previewId).src = e.target.result;
    document.getElementById(previewId).style.display = 'block';
    tempProdImg = e.target.result;
  }
  reader.readAsDataURL(file);
}

function changeBgColor(color){
  siteData.bgColor = color;
  document.body.style.background = color;
  saveData();
}
function changeHeaderColor(color){
  siteData.headerColor = color;

}

function exportData(){
  const dataStr = JSON.stringify({siteData, users, cart});
  const blob = new Blob([dataStr], {type: "application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = "oskar_backup.json"; a.click();
  URL.revokeObjectURL(url);
}

function renderCategories(){
  let html = '';
  siteData.categories.forEach(cat=>{
    html += `<div class="cat-card" onclick="openCategory('${cat.id}')">
      <div class="card-admin" style="display:${adminActive?'flex':'none'}">
        <button onclick="editCategory('${cat.id}');event.stopPropagation()"><i class="fa-solid fa-pen"></i></button>
        <button onclick="changeCatImage('${cat.id}');event.stopPropagation()"><i class="fa-solid fa-image"></i></button>
      </div>
      <img src="${cat.img}"><h3>${cat.name}</h3></div>`;
  });
  document.getElementById('categoriesGrid').innerHTML = html;
  let select = document.getElementById('productCat');
  select.innerHTML = '';
  siteData.categories.forEach(cat=>{select.innerHTML += `<option value="${cat.id}">${cat.name}</option>`;});
}

function openCategory(catId){
  currentCat = catId;
  document.getElementById('mainContent').style.display = 'none';
  document.getElementById('categoryPage').style.display = 'block';
  document.getElementById('addProductBtn').style.display = adminActive? 'block' : 'none';
  let cat = siteData.categories.find(c=>c.id==catId);
  document.getElementById('catPageTitle').innerText = cat.name;

  if(catId == 'phones'){
    document.getElementById('brandGrid').style.display = 'grid';
    let brandHtml = '';
    siteData.phoneBrands.forEach(b=>{
      let count = b.products.length;
      brandHtml += `<div class="cat-card" onclick="openBrand('${b.id}')">
        <div class="card-admin" style="display:${adminActive?'flex':'none'}">
          <button onclick="editBrand('${b.id}');event.stopPropagation()"><i class="fa-solid fa-pen"></i></button>
          <button onclick="changeBrandImage('${b.id}');event.stopPropagation()"><i class="fa-solid fa-image"></i></button>
          <button onclick="quickAddToBrand('${b.id}');event.stopPropagation()"><i class="fa-solid fa-plus"></i></button>
        </div>
        ${count>0?`<div class="notification">${count}</div>`:''}
        <img src="${b.img}"><h3>${b.name}</h3></div>`;
    });
    document.getElementById('brandGrid').innerHTML = brandHtml;
    document.getElementById('catProductsGrid').innerHTML = '';
  }else{
    document.getElementById('brandGrid').style.display = 'none';
    let html = '';
    siteData.products[catId].forEach((p,i)=>{
      html += `<div class="product-card">
        <div class="card-admin" style="display:${adminActive?'flex':'none'}">
          <button onclick="editProduct('${catId}',${i})"><i class="fa-solid fa-pen"></i></button>
          <button onclick="changeProdImage('${catId}',${i})"><i class="fa-solid fa-image"></i></button>
          <button class="del" onclick="deleteProduct('${catId}',${i})"><i class="fa-solid fa-trash"></i></button>
        </div>
        <img src="${p.img}"><div class="product-name">${p.name}</div>
        <div class="product-price">${parseInt(p.price).toLocaleString()} ل.س</div>
        <button class="add-cart-btn" onclick='addToCart(${JSON.stringify(p)})'>اضافة للعربة</button>
      </div>`;
    });
    document.getElementById('catProductsGrid').innerHTML = html || '<p style="text-align:center;padding:20px">لا توجد منتجات</p>';
  }
}

function openBrand(brandId){
  currentBrand = brandId;
  let brand = siteData.phoneBrands.find(b=>b.id==brandId);
  document.getElementById('catPageTitle').innerText = brand.name;
  document.getElementById('brandGrid').style.display = 'none';
  let html = '';
  brand.products.forEach((p,i)=>{
    html += `<div class="product-card">
      <div class="card-admin" style="display:${adminActive?'flex':'none'}">
        <button onclick="editBrandProduct('${brandId}',${i})"><i class="fa-solid fa-pen"></i></button>
        <button onclick="changeBrandProdImage('${brandId}',${i})"><i class="fa-solid fa-image"></i></button>
        <button class="del" onclick="deleteBrandProduct('${brandId}',${i})"><i class="fa-solid fa-trash"></i></button>
      </div>
      <img src="${p.img}"><div class="product-name">${p.name}</div>
      <div class="product-price">${parseInt(p.price).toLocaleString()} ل.س</div>
      <button class="add-cart-btn" onclick='addToCart(${JSON.stringify(p)})'>اضافة للعربة</button>
    </div>`;
  });
  if(adminActive){
    html += `<button class="add-product-in-cat" onclick="quickAddToBrand('${brandId}')"><i class="fa-solid fa-plus"></i> اضافة منتج ل ${brand.name}</button>`;
  }
  document.getElementById('catProductsGrid').innerHTML = html;
}

function quickAddToCurrentCat(){document.getElementById('productCat').value = currentCat;document.getElementById('adminPanel').classList.add('show');}
function quickAddToBrand(brandId){document.getElementById('productCat').value = 'phones';currentBrand=brandId;document.getElementById('productName').placeholder = `اسم المنتج ل ${brandId}`;document.getElementById('adminPanel').classList.add('show');}

function addProduct(){
  let cat=document.getElementById('productCat').value;
  let name=document.getElementById('productName').value.trim();
  let price=document.getElementById('productPrice').value;
  let img=tempProdImg || 'https://via.placeholder.com/150';
  if(!name||!price){alert('كمل البيانات');return}
  let product = {name,price,img};
  if(cat=='phones' && currentBrand){
    let brand = siteData.phoneBrands.find(b=>b.id==currentBrand);
    brand.products.push(product);
  }else{
    siteData.products[cat].push(product);
  }
  saveData();renderAll();alert('تمت الاضافة');
  document.getElementById('productName').value='';document.getElementById('productPrice').value='';
  document.getElementById('prodPreview').style.display='none';tempProdImg='';
}

function deleteProduct(cat,i){if(confirm('حذف المنتج؟')){siteData.products[cat].splice(i,1);saveData();renderAll();}}
function deleteBrandProduct(brandId,i){if(confirm('حذف المنتج؟')){let brand = siteData.phoneBrands.find(b=>b.id==brandId);brand.products.splice(i,1);saveData();renderAll();}}
