<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مركز اوسكار التقني</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--bg:#EAEDED;--card:#fff;--blue:#232F3E;--orange:#FF9900;--green:#067D62; --red:#B12704; --yellow:#FFD814; --text:#0F1111}
body.dark{--bg:#131921;--card:#232F3E;--text:#fff}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
body{background:var(--bodyBg, var(--bg)) center/cover fixed;color:var(--text);padding-bottom:70px}

.top-header{background:var(--blue);padding:10px;color:#fff;position:sticky;top:0;z-index:999}
.brand-row{display:flex;justify-content:space-between;align-items:center}
.brand-name{font-weight:900;font-size:1.4rem;color:var(--orange);cursor:pointer}
.whatsapp-top{background:#25D366;color:#fff;border:none;padding:8px 12px;border-radius:8px;font-weight:700;cursor:pointer;font-size:0.9rem}
.search-area{display:flex;gap:0;padding:10px 0 0 0;position:relative}
.search-icon{background:var(--orange);padding:0 15px;display:flex;align-items:center;border-radius:0 8px 8px 0;font-size:1.2rem;cursor:pointer}
.search-area input{flex:1;padding:10px;border:none;outline:none;font-size:1rem;border-radius:8px 0 0 8px}

.section-title{background:var(--card);padding:15px;font-size:1.3rem;font-weight:900;text-align:center;border-bottom:1px solid #ddd;color:var(--text)}

.categories-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:10px;background:var(--card)}
.cat-card{background:var(--bg);border:1px solid #ddd;border-radius:10px;padding:15px;text-align:center;position:relative;cursor:pointer}
body.dark.cat-card{border-color:#444}
.cat-card i{font-size:2.5rem;color:var(--orange);margin-bottom:10px}
.cat-card h3{font-size:1rem;color:var(--text)}

.products-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:10px;background:var(--card)}
.product-card{background:var(--bg);border:1px solid #ddd;border-radius:8px;padding:10px;text-align:center;position:relative}
body.dark.product-card{border-color:#444}
.product-card img{width:100%;height:140px;object-fit:contain;margin-bottom:8px}
.product-name{font-size:0.9rem;height:40px;overflow:hidden;text-align:right;color:var(--text)}
.product-price{color:var(--red);font-weight:900;font-size:1.1rem;text-align:right}

.card-admin{position:absolute;top:5px;left:5px;display:none;gap:4px;z-index:10}
.card:hover.card-admin{display:flex}
.card-admin button{background:var(--yellow);color:#000;border:none;border-radius:6px;width:28px;height:28px;cursor:pointer;font-size:0.8rem}
.card-admin.del{background:var(--red);color:#fff}

.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid #ddd;display:flex;justify-content:space-around;padding:8px 0;z-index:998}
.nav-item{text-align:center;font-size:0.8rem;color:var(--text);cursor:pointer;position:relative}
.nav-item i{font-size:1.5rem;display:block;margin-bottom:3px}
.cart-count{position:absolute;top:-5px;right:15px;background:var(--red);color:#fff;border-radius:50%;width:18px;height:18px;font-size:0.7rem;display:flex;align-items:center;justify-content:center;font-weight:900}

#sideMenu{display:none;position:fixed;top:0;right:0;width:300px;height:100%;background:var(--card);z-index:10001;padding:20px;border-left:2px solid var(--orange)}
#sideMenu.show{display:block}

#adminPanel{position:fixed;top:0;right:-400px;width:400px;height:100%;background:#232F3E;z-index:99999;overflow-y:auto;padding:20px;border-left:3px solid var(--orange);transition:right 0.4s ease;color:#fff}
#adminPanel.show{right:0}
.admin-box h2{color:var(--orange);text-align:center;margin-bottom:15px}
.admin-section{border:1px solid #555;padding:15px;border-radius:10px;margin:15px 0}
.admin-box input,.admin-box textarea,.admin-box select{width:100%;padding:10px;margin:8px 0;border-radius:8px;border:1px solid var(--orange);background:#131921;color:#fff}
.admin-box button{padding:10px;border:none;border-radius:8px;font-weight:700;cursor:pointer;width:100%;margin:5px 0;background:var(--green);color:#fff}
.close-admin{position:absolute;top:10px;left:10px;background:var(--red);color:#fff;border:none;padding:8px 12px;border-radius:5px;cursor:pointer}
.preview-img{width:80px;height:80px;border-radius:8px;object-fit:cover;margin:5px;border:2px solid var(--orange)}
.color-picker{width:100%;height:40px;border:none;border-radius:8px;cursor:pointer}

/* نافذة الحساب */
#accountModal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#000a;z-index:100002;align-items:center;justify-content:center}
#accountModal.show{display:flex}
.account-box{background:var(--card);width:90%;max-width:400px;padding:20px;border-radius:15px;color:var(--text)}
.account-tabs{display:flex;gap:5px;margin-bottom:15px}
.account-tabs button{flex:1;padding:10px;border:none;border-radius:8px;background:#ddd;cursor:pointer}
.account-tabs button.active{background:var(--orange);color:#000}
</style>
</head>
<body>

<div class="top-header">
  <div class="brand-row">
    <div class="brand-name" onclick="document.getElementById('headerImgInput').click()"><i class="fa-solid fa-microchip"></i> مركز اوسكار التقني</div>
    <input type="file" id="headerImgInput" accept="image/*" style="display:none" onchange="changeHeaderImg(this)">
    <button class="whatsapp-top" onclick="window.open('https://wa.me/+963','_blank')"><i class="fa-brands fa-whatsapp"></i></button>
  </div>
  <div class="search-area">
    <div class="search-icon" onclick="searchProduct()"><i class="fa-solid fa-magnifying-glass"></i></div>
    <input type="text" id="searchInput" placeholder="البحث في مركز اوسكار" onkeyup="searchProduct()">
  </div>
</div>

<div id="mainContent">
  <div id="categoriesGrid" class="categories-grid"></div>
  <h2 class="section-title">خصومات كبيرة لك</h2>
  <div id="productsGrid" class="products-grid"></div>
</div>

<div id="sideMenu">
  <h3><i class="fa-solid fa-gear"></i> الاعدادات</h3>
  <button onclick="toggleTheme()" style="width:100%;padding:12px;margin:8px 0;border:none;border-radius:8px;background:var(--blue);color:#fff;font-weight:700;cursor:pointer"><i class="fa-solid fa-circle-half-stroke"></i> الوضع الليلي / النهاري</button>
</div>

<div class="bottom-nav">
  <div class="nav-item" onclick="document.getElementById('sideMenu').classList.toggle('show')"><i class="fa-solid fa-bars"></i>تصفح</div>
  <div class="nav-item"><i class="fa-solid fa-cart-shopping"></i>العربة <span id="cartCount" class="cart-count">0</span></div>
  <div class="nav-item" onclick="openAccount()"><i class="fa-solid fa-user"></i>حسابك</div>
  <div class="nav-item"><i class="fa-solid fa-house"></i>الرئيسية</div>
</div>

<!-- نافذة الحساب -->
<div id="accountModal">
  <div class="account-box">
    <div id="loggedInView" style="display:none">
      <h3 id="userNameDisplay"></h3>
      <button onclick="logout()" style="background:var(--red);color:#fff;width:100%;padding:12px;border:none;border-radius:8px">تسجيل خروج</button>
      <button onclick="closeAccount()" style="background:#888;color:#fff;width:100%;padding:12px;border:none;border-radius:8px;margin-top:10px">اغلاق</button>
    </div>
    <div id="guestView">
      <div class="account-tabs">
        <button id="tabLogin" class="active" onclick="showLogin()">تسجيل دخول</button>
        <button id="tabRegister" onclick="showRegister()">انشاء حساب</button>
      </div>
      <div id="loginForm">
        <input type="text" id="loginUser" placeholder="الايميل او رقم الجوال">
        <input type="password" id="loginPass" placeholder="كلمة السر">
        <button onclick="login()" style="background:var(--green);color:#fff;width:100%;padding:12px;border:none;border-radius:8px">دخول</button>
      </div>
      <div id="registerForm" style="display:none">
        <input type="text" id="regName" placeholder="الاسم الكامل">
        <input type="text" id="regUser" placeholder="الايميل او رقم الجوال">
        <input type="password" id="regPass" placeholder="كلمة السر">
        <button onclick="register()" style="background:var(--orange);color:#000;width:100%;padding:12px;border:none;border-radius:8px">انشاء حساب</button>
      </div>
      <button onclick="closeAccount()" style="background:var(--red);color:#fff;width:100%;padding:10px;border:none;border-radius:8px;margin-top:10px">اغلاق</button>
    </div>
  </div>
</div>

<!-- لوحة التحكم -->
<div id="adminPanel">
  <button class="close-admin" onclick="toggleAdmin()">X</button>
  <div class="admin-box">
    <h2><i class="fa-solid fa-user-shield"></i> لوحة التحكم</h2>

    <div class="admin-section">
      <h3>1. اضافة قسم</h3>
      <input type="text" id="newCatName" placeholder="اسم القسم">
      <input type="text" id="newCatIcon" placeholder="الايقونة: fa-solid fa-tag">
      <button onclick="addCategory()">اضافة قسم</button>
    </div>

    <div class="admin-section">
      <h3>2. اضافة منتج</h3>
      <select id="productCat"></select>
      <input type="text" id="productName" placeholder="اسم المنتج">
      <input type="number" id="productPrice" placeholder="السعر">
      <input type="file" id="productImgFile" accept="image/*" onchange="previewImg(this,'prodPreview')">
      <img id="prodPreview" class="preview-img" style="display:none">
      <button onclick="addProduct()">اضافة منتج</button>
    </div>

    <div class="admin-section">
      <h3>3. تخصيص الموقع</h3>
      <label>لون الخلفية:</label>
      <input type="color" id="bgColor" class="color-picker" onchange="changeBgColor(this.value)">
      <label>صورة خلفية:</label>
      <input type="file" id="bgFile" accept="image/*" onchange="changeBackground(this)">
      <img id="bgPreview" class="preview-img" style="display:none">
      <button onclick="removeBg()" style="background:var(--red)">حذف الخلفية</button>
    </div>

    <div class="admin-section">
      <h3>4. بيانات الموقع</h3>
      <input type="text" id="siteLocation" placeholder="الموقع: سوريا - حلب">
      <textarea id="siteDetails" placeholder="تفاصيل الموقع"></textarea>
      <button onclick="saveLocation()">حفظ الموقع</button>
    </div>

    <button onclick="saveData()" style="background:var(--green)">حفظ كل التغييرات</button>
    <button onclick="resetData()" style="background:var(--red)">ارجاع الافتراضي</button>
  </div>
</div>

<script>
let siteData = JSON.parse(localStorage.getItem('oskarSiteDataV6')) || {
  bodyBg: "", bgColor:"#EAEDED", location:"", details:"",
  categories: [
    {id:"bazar", name:"بازار", icon:"fa-solid fa-tag"},
    {id:"must", name:"مستلزماتك", icon:"fa-solid fa-bag-shopping"},
    {id:"offers", name:"كل العروض", icon:"fa-solid fa-percent"}
  ],
  products: {bazar:[], must:[], offers:[]}
};
let users = JSON.parse(localStorage.getItem('oskarUsersV6')) || [];
let currentUser = JSON.parse(localStorage.getItem('oskarCurrentUserV6')) || null;
let adminActive = false;

function renderAll(){
  document.body.style.setProperty('--bg', siteData.bgColor);
  let catHtml = '';
  siteData.categories.forEach(cat=>{
    catHtml += `<div class="cat-card">
      <div class="card-admin">
        <button onclick="editCat('${cat.id}')"><i class="fa-solid fa-pen"></i></button>
        <button onclick="deleteCat('${cat.id}')"><i class="fa-solid fa-trash"></i></button>
      </div>
      <i class="${cat.icon}"></i><h3>${cat.name}</h3></div>`;
  });
  document.getElementById('categoriesGrid').innerHTML = catHtml;

  let prodHtml = '';
  for(let catId in siteData.products){
    siteData.products[catId].forEach((p,i)=>{
      prodHtml += `<div class="product-card">
        <div class="card-admin">
          <button onclick="editProd('${catId}',${i})"><i class="fa-solid fa-pen"></i></button>
          <button onclick="changeProdImg('${catId}',${i})"><i class="fa-solid fa-image"></i></button>
          <button class="del" onclick="deleteProd('${catId}',${i})"><i class="fa-solid fa-trash"></i></button>
        </div>
        <img src="${p.img}"><div class="product-name">${p.name}</div><div class="product-price">${p.price} $</div>
      </div>`;
    });
  }
  document.getElementById('productsGrid').innerHTML = prodHtml;

  let select = document.getElementById('productCat'); select.innerHTML='';
  siteData.categories.forEach(cat=>{select.innerHTML += `<option value="${cat.id}">${cat.name}</option>`;});

  if(currentUser) document.querySelector('.nav-item:nth-child(3)').innerHTML = `<i class="fa-solid fa-user"></i>${currentUser.name}`;
}

function searchProduct(){
  let val = document.getElementById('searchInput').value;
  if(val === 'oskad0099'){ toggleAdmin(); document.getElementById('searchInput').value = ''; }
}

function toggleAdmin(){ adminActive =!adminActive; document.getElementById('adminPanel').classList.toggle('show'); }

function addCategory(){
  let name = document.getElementById('newCatName').value.trim();
  let icon = document.getElementById('newCatIcon').value.trim() || 'fa-solid fa-box';
  let id = name.replace(/\s/g,'');
  if(!name) return alert('ادخل اسم القسم');
  siteData.categories.push({id,name,icon}); siteData.products[id] = [];
  saveData(); renderAll();
}

function deleteCat(id){ if(confirm('حذف؟')){ siteData.categories = siteData.categories.filter(c=>c.id!=id); delete siteData.products[id]; saveData(); renderAll(); } }
function editCat(id){ let n=prompt('الاسم الجديد:'); if(n){ siteData.categories.find(c=>c.id==id).name=n; saveData(); renderAll(); } }

function previewImg(input,id){ let r=new FileReader(); r.onload=e=>{document.getElementById(id).src=e.target.result;document.getElementById(id).style.display='block'}; r.readAsDataURL(input.files[0]); }
function addProduct(){
  let cat=document.getElementById('productCat').value;
  let name=document.getElementById('productName').value;
  let price=document.getElementById('productPrice').value;
  let img=document.getElementById('prodPreview').src || 'https://via.placeholder.com/150';
  if(!name||!price) return alert('كمل البيانات');
  siteData.products[cat].push({name,price,img}); saveData(); renderAll();
}
function deleteProd(cat,i){ if(confirm('حذف؟')){ siteData.products[cat].splice(i,1); saveData(); renderAll(); } }
function editProd(cat,i){ let n=prompt('الاسم الجديد:',siteData.products[cat][i].name); if(n){ siteData.products[cat][i].name=n; saveData(); renderAll(); } }
function changeProdImg(cat,i){ let f=document.createElement('input');f.type='file';f.onchange=e=>{let r=new FileReader();r.onload=ev=>{siteData.products[cat][i].img=ev.target.result;saveData();renderAll();};r.readAsDataURL(e.target.files[0]);};f.click(); }

function changeHeaderImg(input){ let r=new FileReader(); r.onload=e=>{document.querySelector('.top-header').style.backgroundImage=`url('${e.target.result}')`; document.querySelector('.top-header').style.backgroundSize='cover';} r.readAsDataURL(input.files[0]); }
function changeBackground(input){ let r=new FileReader();r.onload=e=>{siteData.bodyBg=`url('${e.target.result}')`;document.body.style.setProperty('--bodyBg',siteData.bodyBg);document.getElementById('bgPreview').src=e.target.result;document.getElementById('bgPreview').style.display='block';saveData();} r.readAsDataURL(input.files[0]); }
function changeBgColor(color){ siteData.bgColor = color; saveData(); renderAll(); }
function removeBg(){ siteData.bodyBg=""; document.body.style.setProperty('--bodyBg',''); document.getElementById('bgPreview').style.display='none'; saveData(); }
function saveLocation(){ siteData.location=document.getElementById('siteLocation').value; siteData.details=document.getElementById('siteDetails').value; saveData(); alert('تم الحفظ'); }

function openAccount(){ document.getElementById('accountModal').classList.add('show'); if(currentUser){document.getElementById('guestView').style.display='none';document.getElementById('loggedInView').style.display='block';document.getElementById('userNameDisplay').innerText=currentUser.name;} }
function closeAccount(){ document.getElementById('accountModal').classList.remove('show') }
function showRegister(){document.getElementById('loginForm').style.display='none';document.getElementById('registerForm').style.display='block';document.getElementById('tabLogin').classList.remove('active');document.getElementById('tabRegister').classList.add('active')}
function showLogin(){document.getElementById('registerForm').style.display='none';document.getElementById('loginForm').style.display='block';document.getElementById('tabRegister').classList.remove('active');document.getElementById('tabLogin').classList.add('active')}
function register(){ let name=document.getElementById('regName').value; let user=document.getElementById('regUser').value; let pass=document.getElementById('regPass').value; users.push({name,user,pass}); localStorage.setItem('oskarUsersV6',JSON.stringify(users)); alert('تم انشاء الحساب'); showLogin(); }
function login(){ let user=document.getElementById('loginUser').value; let pass=document.getElementById('loginPass').value; let u = users.find(u=>u.user==user && u.pass==pass); if(!u) return alert('خطأ'); currentUser=u; localStorage.setItem('oskarCurrentUserV6',JSON.stringify(u)); closeAccount(); renderAll(); }
function logout(){ currentUser=null; localStorage.removeItem('oskarCurrentUserV6'); renderAll(); closeAccount(); }

function saveData(){ localStorage.setItem('oskarSiteDataV6',JSON.stringify(siteData)); }
function resetData(){ if(confirm('ارجاع؟')){ localStorage.removeItem('oskarSiteDataV6'); location.reload(); } }
function toggleTheme(){ document.body.classList.toggle('dark'); }

window.onload=function(){
  if(siteData.bodyBg) document.body.style.setProperty('--bodyBg',siteData.bodyBg);
  document.getElementById('bgColor').value = siteData.bgColor;
  document.getElementById('siteLocation').value = siteData.location;
  document.getElementById('siteDetails').value = siteData.details;
  renderAll();
}
</script>
</body>
</html>
