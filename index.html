<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مركز اوسكار التقني</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--bg:#FFFFFF;--card:#fff;--blue:#232F3E;--orange:#FF9900;--green:#067D62; --red:#B12704; --yellow:#FFD814; --text:#0F1111}
body.dark{--bg:#131921;--card:#232F3E;--text:#fff}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
body{background:var(--bg);color:var(--text);padding-bottom:70px}
.top-header{background:var(--blue);padding:10px;color:#fff;position:sticky;top:0;z-index:999}
.brand-row{display:flex;justify-content:space-between;align-items:center}
.brand-name{font-weight:900;font-size:1.4rem;color:var(--orange)}
.whatsapp-top{background:#25D366;color:#fff;border:none;padding:8px 12px;border-radius:8px;font-weight:700;cursor:pointer;font-size:0.9rem}
.search-area{display:flex;gap:0;padding:10px 0 0 0}
.search-icon{background:var(--orange);padding:0 10px;display:flex;align-items:center;border-radius:0 8px 8px 0;font-size:1.1rem;cursor:pointer}
.search-area input{flex:1;padding:10px;border:none;outline:none;font-size:0.95rem;border-radius:8px 0 0 8px}
.section-title{background:var(--card);padding:15px;font-size:1.3rem;font-weight:900;text-align:center;border-bottom:1px solid #ddd;color:var(--text)}
.categories-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:10px;background:var(--card)}
@media(min-width:768px){.categories-grid{grid-template-columns:repeat(4,1fr);}}
.cat-card{background:var(--bg);border:1px solid #ddd;border-radius:10px;padding:10px;text-align:center;position:relative;cursor:pointer;transition:0.2s}
.cat-card:hover{transform:translateY(-3px);box-shadow:0 4px 10px #0002}
.cat-card img{width:100%;height:100px;object-fit:contain;border-radius:8px;margin-bottom:8px;background:#fff;padding:10px}
.cat-card h3{font-size:1rem;color:var(--text);font-weight:900}
.notification{position:absolute;top:5px;right:5px;background:var(--red);color:#fff;border-radius:50%;width:22px;height:22px;font-size:0.75rem;display:flex;align-items:center;justify-content:center;font-weight:900}
.products-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:10px;background:var(--card)}
@media(min-width:768px){.products-grid{grid-template-columns:repeat(4,1fr);}}
.product-card{background:var(--bg);border:1px solid #ddd;border-radius:8px;padding:10px;text-align:center;position:relative}
.product-card img{width:100%;height:140px;object-fit:contain;margin-bottom:8px}
.product-name{font-size:0.9rem;height:40px;overflow:hidden;text-align:right}
.product-price{color:var(--red);font-weight:900;font-size:1.1rem;text-align:right}
.add-cart-btn{background:var(--yellow);border:none;width:100%;padding:8px;border-radius:20px;margin-top:8px;font-weight:700;cursor:pointer;color:#000}
.add-product-in-cat{background:var(--green);color:#fff;border:none;padding:12px;width:95%;margin:10px auto;display:block;border-radius:10px;font-weight:900;cursor:pointer}
.card-admin{position:absolute;top:5px;left:5px;display:flex;gap:4px;z-index:10;flex-wrap:wrap;width:90px}
.card-admin button{background:var(--yellow);color:#000;border:none;border-radius:6px;width:28px;height:28px;cursor:pointer;font-size:0.8rem}
.card-admin.del{background:var(--red);color:#fff}
.back-btn{background:var(--blue);color:#fff;border:none;padding:10px 15px;border-radius:8px;margin:10px;cursor:pointer}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid #ddd;display:flex;justify-content:space-around;padding:8px 0;z-index:998}
.nav-item{text-align:center;font-size:0.8rem;color:var(--text);cursor:pointer;position:relative}
.nav-item i{font-size:1.5rem;display:block;margin-bottom:3px}
.cart-count{position:absolute;top:-5px;right:15px;background:var(--red);color:#fff;border-radius:50%;width:18px;height:18px;font-size:0.7rem;display:flex;align-items:center;justify-content:center;font-weight:900}
#sideMenu{display:none;position:fixed;top:0;right:0;width:300px;height:100%;background:var(--card);z-index:10001;padding:20px;border-left:2px solid var(--orange)}
#sideMenu.show{display:block}
#sideMenu h3{color:var(--orange);margin:15px 0}
#sideMenu button{width:100%;padding:12px;margin:8px 0;border:none;border-radius:8px;background:var(--blue);color:#fff;font-weight:700;cursor:pointer;text-align:right}
.overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#000a;z-index:10000}
.overlay.show{display:block}
#adminPanel{position:fixed;top:0;left:-450px;width:450px;height:100%;background:#232F3E;z-index:99999;overflow-y:auto;padding:20px;border-right:3px solid var(--orange);transition:left 0.4s ease;color:#fff}
#adminPanel.show{left:0}
.admin-toggle{position:fixed;top:50%;left:0;background:var(--orange);color:#000;border:none;padding:15px 8px;border-radius:0 10px 10px 0;font-size:1.5rem;cursor:pointer;z-index:100000;display:none}
.admin-toggle.show{display:block}
.admin-box h2{color:var(--orange);text-align:center;margin-bottom:15px}
.admin-section{border:1px solid #555;padding:15px;border-radius:10px;margin:15px 0}
.admin-box input,.admin-box select{width:100%;padding:10px;margin:8px 0;border-radius:8px;border:1px solid var(--orange);background:#131921;color:#fff}
.admin-box button{padding:10px;border:none;border-radius:8px;font-weight:700;cursor:pointer;width:100%;margin:5px 0}
.color-picker{width:100%;height:40px;border:none;border-radius:8px;cursor:pointer}
.preview-img{width:80px;height:80px;border-radius:8px;object-fit:cover;margin:5px;border:2px solid var(--orange)}
#cartModal, #accountModal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#000a;z-index:100003;align-items:center;justify-content:center}
#cartModal.show, #accountModal.show{display:flex}
.modal-box{background:var(--card);width:95%;max-width:500px;padding:20px;border-radius:15px;max-height:90vh;overflow-y:auto;color:var(--text)}
.cart-item{display:flex;gap:10px;border-bottom:1px solid #ddd;padding:10px 0}
.cart-item img{width:60px;height:60px;object-fit:contain}
</style>
</head>
<body>

<div class="top-header" id="topHeader">
  <div class="brand-row">
    <div class="brand-name"><i class="fa-solid fa-microchip"></i> مركز اوسكار التقني</div>
    <button class="whatsapp-top" onclick="window.open('https://wa.me/+971544066811','_blank')"><i class="fa-brands fa-whatsapp"></i> تواصل</button>
  </div>
  <div class="search-area">
    <div class="search-icon" onclick="alert('اكتب oskad0099 لتفعيل لوحة التحكم')"><i class="fa-solid fa-magnifying-glass"></i></div>
    <input type="text" id="searchInput" placeholder="البحث في مركز اوسكار" onkeyup="checkSecret()">
  </div>
</div>

<div id="mainContent">
  <h2 class="section-title">الاقسام</h2>
  <div id="categoriesGrid" class="categories-grid"></div>
  <h2 class="section-title">خصومات كبيرة لك</h2>
  <div id="productsGrid" class="products-grid"></div>
</div>

<div id="categoryPage" style="display:none">
  <button class="back-btn" onclick="goHome()"><i class="fa-solid fa-arrow-right"></i> رجوع للاقسام</button>
  <h2 class="section-title" id="catPageTitle"></h2>
  <button class="add-product-in-cat" style="display:none" id="addProductBtn" onclick="quickAddCat()"><i class="fa-solid fa-plus"></i> + اضافة منتج لهذا القسم</button>
  <div id="brandGrid" class="categories-grid" style="display:none"></div>
  <div id="catProductsGrid" class="products-grid"></div>
</div>

<div class="overlay" id="overlay" onclick="toggleMenu()"></div>
<div id="sideMenu">
  <h3><i class="fa-solid fa-gear"></i> الاعدادات</h3>
  <button onclick="toggleTheme()"><i class="fa-solid fa-circle-half-stroke"></i> الوضع الليلي / النهاري</button>
</div>

<div class="bottom-nav">
  <div class="nav-item" onclick="toggleMenu()"><i class="fa-solid fa-bars"></i>تصفح</div>
  <div class="nav-item" onclick="openAccount()"><i class="fa-solid fa-user"></i>حسابي</div>
  <div class="nav-item" onclick="openCart()"><i class="fa-solid fa-cart-shopping"></i>العربة <span id="cartCount" class="cart-count">0</span></div>
  <div class="nav-item" onclick="goHome()"><i class="fa-solid fa-house"></i>الرئيسية</div>
</div>

<div id="cartModal"><div class="modal-box">
  <h3 style="text-align:center;margin-bottom:15px">سلة التسوق</h3><div id="cartItems"></div>
  <h4>بيانات التوصيل</h4>
  <input type="text" id="customerName" placeholder="الاسم الكامل">
  <input type="text" id="customerPhone" placeholder="رقم الجوال">
  <input type="text" id="customerAddress" placeholder="العنوان بالتفصيل">
  <button onclick="getLocation()" style="background:var(--blue);color:#fff">تحديد موقعي الحالي</button>
  <input type="hidden" id="lat"><input type="hidden" id="lng"><p id="locationText" style="font-size:0.8rem;color:green"></p>
  <h4>طريقة الدفع</h4>
  <select id="paymentMethod"><option>الدفع عند الاستلام</option><option>تحويل بنكي</option></select>
  <button onclick="sendOrder()" style="background:var(--green);color:#fff;margin-top:10px">تأكيد الطلب</button>
  <button onclick="closeCart()" style="background:var(--red);color:#fff;margin-top:10px">اغلاق</button>
</div></div>

<div id="accountModal"><div class="modal-box">
  <div id="loggedInView" style="display:none"><h3 id="userNameDisplay"></h3>
    <button onclick="logout()" style="background:var(--red);color:#fff;width:100%;padding:12px;border:none;border-radius:8px">تسجيل خروج</button>
    <button onclick="closeAccount()" style="background:#888;color:#fff;width:100%;padding:12px;border:none;border-radius:8px;margin-top:10px">اغلاق</button>
  </div>
  <div id="guestView">
    <div style="display:flex;gap:5px;margin-bottom:15px">
      <button id="tabLogin" onclick="showLogin()" style="flex:1;padding:10px;border:none;border-radius:8px;background:var(--orange);color:#000;font-weight:700">تسجيل دخول</button>
      <button id="tabRegister" onclick="showRegister()" style="flex:1;padding:10px;border:none;border-radius:8px;background:#ddd;font-weight:700">انشاء حساب</button>
    </div>
    <div id="loginForm"><input id="loginUser" placeholder="الايميل او رقم الجوال"><input type="password" id="loginPass" placeholder="كلمة السر"><button onclick="login()" style="background:var(--green);color:#fff;width:100%;padding:12px;border:none;border-radius:8px">دخول</button></div>
    <div id="registerForm" style="display:none"><input id="regName" placeholder="الاسم الكامل"><input id="regUser" placeholder="الايميل او رقم الجوال"><input type="password" id="regPass" placeholder="كلمة السر"><button onclick="register()" style="background:var(--orange);color:#000;width:100%;padding:12px;border:none;border-radius:8px">انشاء حساب</button></div>
    <button onclick="closeAccount()" style="background:var(--red);color:#fff;width:100%;padding:10px;border:none;border-radius:8px;margin-top:10px">اغلاق</button>
  </div>
</div></div>

<button id="adminToggleBtn" class="admin-toggle" onclick="toggleAdminPanel()"><i class="fa-solid fa-chevron-right"></i></button>
<div id="adminPanel"><div class="admin-box">
  <h2><i class="fa-solid fa-user-shield"></i> لوحة التحكم</h2>
  <button onclick="closeAdminPanel()" style="background:var(--red)">اغلاق</button>
  <div class="admin-section">
    <h3>اضافة منتج</h3>
    <select id="productCat"></select>
    <input id="productName" placeholder="اسم المنتج">
    <input type="number" id="productPrice" placeholder="السعر بالليرة">
    <input type="file" id="productImgFile" accept="image/*" onchange="previewFile(this,'prodPreview')">
    <img id="prodPreview" class="preview-img" style="display:none">
    <button onclick="addProduct()" style="background:var(--green)">اضافة منتج</button>
  </div>
  <div class="admin-section">
    <h3>تغيير الالوان</h3>
    <label>لون الخلفية:</label><input type="color" class="color-picker" id="bgColorPicker" onchange="changeBgColor(this.value)">
    <label>لون الهيدر:</label><input type="color" class="color-picker" id="headerColorPicker" onchange="changeHeaderColor(this.value)">
  </div>
  <div class="admin-section">
    <h3>النسخ الاحتياطي</h3>
    <button onclick="exportData()" style="background:var(--blue)">تصدير البيانات</button>
  </div>
  <button onclick="resetData()" style="background:var(--red)">ارجاع الافتراضي</button>
</div></div>

<script>
let cart=JSON.parse(localStorage.getItem('oskarCartV1'))||[];
let siteData=JSON.parse(localStorage.getItem('oskarSiteDataV1'))||getDefaultData();
let users=JSON.parse(localStorage.getItem('oskarUsersV1'))||[];
let currentUser=JSON.parse(localStorage.getItem('oskarCurrentUserV1'))||null;
let adminActive=localStorage.getItem('adminActiveV1')==='true';
let currentCat='all',currentBrand='',tempProdImg='';
const SECRET="oskad0099";

function getDefaultData(){return{
  bgColor:"#FFFFFF",headerColor:"#232F3E",
  categories:[
    {id:"phones",name:"جوالات",img:"https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=400"},
    {id:"software",name:"شحن برامج",img:"https://images.unsplash.com/photo-1515879218367-8466d910aaa4?w=400"},
    {id:"repair",name:"صيانة",img:"https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?w=400"},
    {id:"accessories",name:"اكسسوارات",img:"https://images.unsplash.com/photo-1498049794561-7780e7231661?w=400"},
    {id:"offers",name:"كل العروض",img:"https://images.unsplash.com/photo-1607082348824-0a96f2a4b9da?w=400"},
    {id:"must",name:"مستلزماتك",img:"https://images.unsplash.com/photo-1556740738-b6a63e27c4df?w=400"}
  ],
  phoneBrands:[
    {id:"iphone",name:"ايفون",img:"https://upload.wikimedia.org/wikipedia/commons/f/fa/Apple_logo_black.svg",products:[]},
    {id:"samsung",name:"سامسونج",img:"https://upload.wikimedia.org/wikipedia/commons/2/24/Samsung_Logo.svg",products:[]},
    {id:"huawei",name:"هواوي",img:"https://upload.wikimedia.org/wikipedia/commons/0/0c/Huawei_Standard_logo.svg",products:[]},
    {id:"xiaomi",name:"شاومي",img:"https://upload.wikimedia.org/wikipedia/commons/ae/Xiaomi_logo_%282021-%29.svg",products:[]},
    {id:"oppo",name:"اوبو",img:"https://upload.wikimedia.org/wikipedia/commons/7/78/Oppo_logo.svg",products:[]},
    {id:"infinix",name:"انفنكس",img:"https://logo.clearbit.com/infinixmobility.com",products:[]},
    {id:"tecno",name:"تكنو",img:"https://logo.clearbit.com/tecno-mobile.com",products:[]},
    {id:"honor",name:"هونر",img:"https://upload.wikimedia.org/wikipedia/commons/8/8c/Honor_logo.svg",products:[]}
  ],
  products:{phones:[],software:[],repair:[],accessories:[],offers:[],must:[]}
}}

function previewFile(i,id){let f=i.files[0];if(!f)return;let r=new FileReader();r.onload=e=>{document.getElementById(id).src=e.target.result;document.getElementById(id).style.display='block';tempProdImg=e.target.result};r.readAsDataURL(f)}
function changeBgColor(c){siteData.bgColor=c;document.body.style.background=c;save()}
function changeHeaderColor(c){siteData.headerColor=c;document.getElementById('topHeader').style.background=c;save()}
function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({siteData,users,cart})]));a.download="oskar_backup.json";a.click()}

function checkSecret(){if(document.getElementById('searchInput').value===SECRET){adminActive=!adminActive;localStorage.setItem('adminActiveV1',adminActive);document.getElementById('adminToggleBtn').classList.toggle('show',adminActive);document.getElementById('adminPanel').classList.toggle('show',adminActive);document.getElementById('searchInput').value='';render()}}

function render(){
  let html='';siteData.categories.forEach(c=>html+=`<div class="cat-card" onclick="openCat('${c.id}')"><div class="card-admin" style="display:${adminActive?'flex':'none'}"><button onclick="editCat('${c.id}');event.stopPropagation()"><i class="fa-solid fa-pen"></i></button><button onclick="changeCatImg('${c.id}');event.stopPropagation()"><i class="fa-solid fa-image"></i></button><button class="del" onclick="delCat('${c.id}');event.stopPropagation()"><i class="fa-solid fa-trash"></i></button></div><img src="${c.img}"><h3>${c.name}</h3></div>`);
  document.getElementById('categoriesGrid').innerHTML=html;
  let sel=document.getElementById('productCat');sel.innerHTML='';siteData.categories.forEach(c=>sel.innerHTML+=`<option value="${c.id}">${c.name}</option>`);
  document.body.style.background=siteData.bgColor;
  document.getElementById('topHeader').style.background=siteData.headerColor;
  document.getElementById('bgColorPicker').value=siteData.bgColor;
  document.getElementById('headerColorPicker').value=siteData.headerColor;
  updateCart();
  if(localStorage.getItem('theme')==='dark')document.body.classList.add('dark');
}

function delCat(id){if(confirm('متأكد تريد حذف القسم؟ سيتم حذف كل المنتجات داخله')){siteData.categories=siteData.categories.filter(c=>c.id!=id);delete siteData.products[id];save();render()}}

function openCat(id){
  currentCat=id;document.getElementById('mainContent').style.display='none';document.getElementById('categoryPage').style.display='block';
  document.getElementById('addProductBtn').style.display=adminActive?'block':'none';
  document.getElementById('catPageTitle').innerText=siteData.categories.find(c=>c.id==id).name;
  if(id=='phones'){
    document.getElementById('brandGrid').style.display='grid';
    let h='';siteData.phoneBrands.forEach(b=>h+=`<div class="cat-card" onclick="openBrand('${b.id}')"><div class="card-admin" style="display:${adminActive?'flex':'none'}"><button onclick="editBrand('${b.id}');event.stopPropagation()"><i class="fa-solid fa-pen"></i></button><button onclick="changeBrandImg('${b.id}');event.stopPropagation()"><i class="fa-solid fa-image"></i></button><button onclick="quickAddBrand('${b.id}');event.stopPropagation()"><i class="fa-solid fa-plus"></i></button></div>${b.products.length?`<div class="notification">${b.products.length}</div>`:''}<img src="${b.img}"><h3>${b.name}</h3></div>`);
    document.getElementById('brandGrid').innerHTML=h;document.getElementById('catProductsGrid').innerHTML='';
  }else{
    document.getElementById('brandGrid').style.display='none';
    let h='';siteData.products[id].forEach((p,i)=>h+=`<div class="product-card"><div class="card-admin" style="display:${adminActive?'flex':'none'}"><button onclick="editProd('${id}',${i})"><i class="fa-solid fa-pen"></i></button><button onclick="changeProdImg('${id}',${i})"><i class="fa-solid fa-image"></i></button><button class="del" onclick="delProd('${id}',${i})"><i class="fa-solid fa-trash"></i></button></div><img src="${p.img}"><div class="product-name">${p.name}</div><div class="product-price">${parseInt(p.price).toLocaleString()} ل.س</div><button class="add-cart-btn" onclick='addCart(${JSON.stringify(p)})'>اضافة للعربة</button></div>`);
    document.getElementById('catProductsGrid').innerHTML=h||'<p style="text-align:center;padding:20px">لا توجد منتجات</p>';
  }
}

function openBrand(id){
  currentBrand=id;let b=siteData.phoneBrands.find(x=>x.id==id);
  document.getElementById('catPageTitle').innerText=b.name;document.getElementById('brandGrid').style.display='none';
  let h='';b.products.forEach((p,i)=>h+=`<div class="product-card"><div class="card-admin" style="display:${adminActive?'flex':'none'}"><button onclick="editBrandProd('${id}',${i})"><i class="fa-solid fa-pen"></i></button><button onclick="changeBrandProdImg('${id}',${i})"><i class="fa-solid fa-image"></i></button><button class="del" onclick="delBrandProd('${id}',${i})"><i class="fa-solid fa-trash"></i></button></div><img src="${p.img}"><div class="product-name">${p.name}</div><div class="product-price">${parseInt(p.price).toLocaleString()} ل.س</div><button class="add-cart-btn" onclick='addCart(${JSON.stringify(p)})'>اضافة للعربة</button></div>`);
  if(adminActive)h+=`<button class="add-product-in-cat" onclick="quickAddBrand('${id}')"><i class="fa-solid fa-plus"></i> + اضافة منتج ل ${b.name}</button>`;
  document.getElementById('catProductsGrid').innerHTML=h;
}

function quickAddCat(){document.getElementById('productCat').value=currentCat;document.getElementById('adminPanel').classList.add('show')}
function quickAddBrand(id){document.getElementById('productCat').value='phones';currentBrand=id;document.getElementById('productName').placeholder=`اسم المنتج ل ${id}`;document.getElementById('adminPanel').classList.add('show')}

function addProduct(){
  let cat=document.getElementById('productCat').value,name=document.getElementById('productName').value.trim(),price=document.getElementById('productPrice').value,img=tempProdImg||'https://via.placeholder.com/150';
  if(!name||!price)return alert('كمل البيانات');
  let p={name,price,img};
  if(cat=='phones'&&currentBrand)siteData.phoneBrands.find(b=>b.id==currentBrand).products.push(p);
  else siteData.products[cat].push(p);
  save();render();alert('تمت الاضافة');document.getElementById('productName').value='';document.getElementById('productPrice').value='';document.getElementById('prodPreview').style.display='none';tempProdImg='';
}

function delProd(c,i){if(confirm('حذف المنتج؟')){siteData.products[c].splice(i,1);save();openCat(c)}}
function delBrandProd(b,i){if(confirm('حذف المنتج؟')){siteData.phoneBrands.find(x=>x.id==b).products.splice(i,1);save();openBrand(b)}}
function editProd(c,i){let p=siteData.products[c][i];let n=prompt('الاسم الجديد:',p.name);let pr=prompt('السعر الجديد:',p.price);if(n&&pr){p.name=n;p.price=pr;save();openCat(c)}}
function editBrandProd(b,i){let p=siteData.phoneBrands.find(x=>x.id==b).products[i];let n=prompt('الاسم الجديد:',p.name);let pr=prompt('السعر الجديد:',p.price);if(n&&pr){p.name=n;p.price=pr;save();openBrand(b)}}
function changeProdImg(c,i){let inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.onchange=e=>{let r=new FileReader();r.onload=ev=>{siteData.products[c][i].img=ev.target.result;save();openCat(c)};r.readAsDataURL(e.target.files[0])};inp.click()}
function changeBrandProdImg(b,i){let inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.onchange=e=>{let r=new FileReader();r.onload=ev=>{siteData.phoneBrands.find(x=>x.id==b).products[i].img=ev.target.result;save();openBrand(b)};r.readAsDataURL(e.target.files[0])};inp.click()}

function editCat(id){let n=prompt('الاسم الجديد:',siteData.categories.find(c=>c.id==id).name);if(n){siteData.categories.find(c=>c.id==id).name=n;save();render()}}
function changeCatImg(id){let inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.onchange=e=>{let r=new FileReader();r.onload=ev=>{siteData.categories.find(c=>c.id==id).img=ev.target.result;save();render()};r.readAsDataURL(e.target.files[0])};inp.click()}
function editBrand(id){let n=prompt('الاسم الجديد:',siteData.phoneBrands.find(b=>b.id==id).name);if(n){siteData.phoneBrands.find(b=>b.id==id).name=n;save();render()}}
function changeBrandImg(id){let inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.onchange=e=>{let r=new FileReader();r.onload=ev=>{siteData.phoneBrands.find(b=>b.id==id).img=ev.target.result;save();render()};r.readAsDataURL(e.target.files[0])};inp.click()}

function addCart(item){let ex=cart.find(p=>p.name==item.name);if(ex)ex.qty++;else cart.push({...item,qty:1});updateCart();saveCart()}
function updateCart(){document.getElementById('cartCount').innerText=cart.reduce((a,b)=>a+b.qty,0)}
function saveCart(){localStorage.setItem('oskarCartV1',JSON.stringify(cart))}

function openCart(){document.getElementById('cartModal').classList.add('show');let h='';if(cart.length==0)h='<p>السلة فاضية</p>';cart.forEach(i=>h+=`<div class="cart-item"><img src="${i.img}"><div><div>${i.name}</div><div>${parseInt(i.price).toLocaleString()} ل.س x ${i.qty}</div></div></div>`);document.getElementById('cartItems').innerHTML=h}
function closeCart(){document.getElementById('cartModal').classList.remove('show')}
function getLocation(){if(navigator.geolocation){navigator.geolocation.getCurrentPosition(pos=>{document.getElementById('lat').value=pos.coords.latitude;document.getElementById('lng').value=pos.coords.longitude;document.getElementById('locationText').innerText='تم تحديد الموقع'})}}
function sendOrder(){let n=document.getElementById('customerName').value,p=document.getElementById('customerPhone').value,a=document.getElementById('customerAddress').value,pm=document.getElementById('paymentMethod').value,lat=document.getElementById('lat').value,lng=document.getElementById('lng').value,map=lat?`https://www.google.com/maps?q=${lat},${lng}`:'لم يتم تحديد الموقع';let msg=`طلب جديد%0Aالاسم: ${n}%0Aالجوال: ${p}%0Aالعنوان: ${a}%0Aالموقع: ${map}%0Aالدفع: ${pm}%0A%0Aالمنتجات:%0A`;cart.forEach(i=>msg+=`${i.name} - ${i.qty} x ${i.price} ل.س%0A`);window.open(`https://wa.me/+971544066811?text=${msg}`,'_blank');cart=[];saveCart();updateCart();closeCart();alert('تم ارسال الطلب')}

function openAccount(){document.getElementById('accountModal').classList.add('show');if(currentUser){document.getElementById('guestView').style.display='none';document.getElementById('loggedInView').style.display='block';document.getElementById('userNameDisplay').innerText='اهلا '+currentUser.name}else{document.getElementById('guestView').style.display='block';document.getElementById('loggedInView').style.display='none'}}
function closeAccount(){document.getElementById('accountModal').classList.remove('show')}
function showRegister(){document.getElementById('loginForm').style.display='none';document.getElementById('registerForm').style.display='block';document.getElementById('tabLogin').style.background='#ddd';document.getElementById('tabRegister').style.background='var(--orange)';document.getElementById('tabRegister').style.color='#000'}
function showLogin(){document.getElementById('registerForm').style.display='none';document.getElementById('loginForm').style.display='block';document.getElementById('tabRegister').style.background='#ddd';document.getElementById('tabLogin').style.background='var(--orange)';document.getElementById('tabLogin').style.color='#000'}
function register(){let n=document.getElementById('regName').value,u=document.getElementById('regUser').value,p=document.getElementById('regPass').value;if(!n||!u||!p)return alert('كمل البيانات');users.push({name:n,user:u,pass:p});localStorage.setItem('oskarUsersV1',JSON.stringify(users));alert('تم انشاء الحساب');showLogin()}
function login(){let u=document.getElementById('loginUser').value,p=document.getElementById('loginPass').value;let us=users.find(x=>x.user==u&&x.pass==p);if(!us)return alert('البيانات خطأ');currentUser=us;localStorage.setItem('oskarCurrentUserV1',JSON.stringify(us));openAccount();alert('اهلا '+us.name)}
function logout(){currentUser=null;localStorage.removeItem('oskarCurrentUserV1');openAccount();alert('تم تسجيل الخروج')}

function toggleMenu(){document.getElementById('sideMenu').classList.toggle('show');document.getElementById('overlay').classList.toggle('show')}
function toggleTheme(){document.body.classList.toggle('dark');localStorage.setItem('theme',document.body.classList.contains('dark')?'dark':'light')}

function toggleAdminPanel(){document.getElementById('adminPanel').classList.toggle('show')}
function closeAdminPanel(){document.getElementById('adminPanel').classList.remove('show');adminActive=false;localStorage.setItem('adminActiveV1','false');document.getElementById('adminToggleBtn').classList.remove('show');render()}
function goHome(){currentCat='all';document.getElementById('mainContent').style.display='block';document.getElementById('categoryPage').style.display='none'}
function save(){localStorage.setItem('oskarSiteDataV1',JSON.stringify(siteData))}
function resetData(){if(confirm('ارجاع كل شي؟')){localStorage.clear();location.reload()}}
window.onload=function(){render();if(adminActive){document.getElementById('adminToggleBtn').classList.add('show');document.getElementById('adminPanel').classList.add('show')}}
</script>
</body>
</html>
