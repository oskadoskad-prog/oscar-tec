<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مركز اوسكار التقني</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--bg:#EAEDED;--card:#fff;--blue:#232F3E;--orange:#FF9900;--green:#067D62; --red:#B12704; --yellow:#FFD814; --text:#0F1111; --blue2:#1A2B4C}
body.dark{--bg:#131921;--card:#232F3E;--text:#fff; --blue2:#0F1A2A}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
body{background:var(--bodyBg, var(--bg)) center/cover fixed;color:var(--text);padding-bottom:70px}

.overlay-logo{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1;opacity:0.08;background:var(--overlayLogo) center/contain no-repeat;display:none}

.top-header{background:linear-gradient(180deg, #4A90E2, #3A7BD5);padding:10px;color:#fff;position:sticky;top:0;z-index:999}

.banners{display:flex;gap:8px;padding:10px;overflow-x:auto;background:transparent}
.banner{flex:0 0 32%;background:#fff;border-radius:12px;text-align:center;padding:12px 5px;cursor:pointer;border:1px solid #eee;box-shadow:0 2px 5px #0001;position:relative}
.banner img{width:40px;height:40px;margin-bottom:5px;border-radius:50%;background:#FFF3E0;padding:8px}
.banner p{font-weight:700;font-size:0.9rem;color:#333}
.banner.edit-banner{position:absolute;top:3px;left:3px;background:var(--orange);color:#000;border:none;border-radius:50%;width:22px;height:22px;font-size:0.7rem;cursor:pointer;display:none;z-index:10}
body.admin.banner.edit-banner{display:block}

.search-area{display:flex;gap:5px;padding:8px 10px 0 10px;align-items:center;background:transparent;position:relative;z-index:2}
.search-cam{background:#fff;border-radius:8px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;color:#333;font-size:1.1rem;cursor:pointer}
.search-box{flex:1;display:flex;background:#fff;border-radius:25px;overflow:hidden}
.search-box input{flex:1;padding:9px 15px;border:none;outline:none;font-size:0.9rem;color:#333}
.search-icon{background:transparent;padding:0 8px;display:flex;align-items:center;font-size:1rem;cursor:pointer;width:28px;justify-content:center;color:#666}
.search-results{position:absolute;top:45px;left:50px;right:50px;background:var(--card);border-radius:8px;max-height:400px;overflow-y:auto;display:none;z-index:1000;box-shadow:0 4px 10px #0003}
.search-item{display:flex;gap:10px;padding:10px;cursor:pointer;border-bottom:1px solid #ddd;color:var(--text)}

.location-bar{display:flex;gap:8px;padding:8px 10px;align-items:center}
.join-prime{background:#fff;color:#232F3E;border:none;padding:6px 12px;border-radius:20px;font-weight:700;font-size:0.85rem;cursor:pointer}
.location-select{background:transparent;color:#fff;border:1px solid #fff;padding:6px 12px;border-radius:20px;font-size:0.85rem;display:flex;align-items:center;gap:5px;cursor:pointer}

.section-title{background:var(--blue2);padding:15px;font-size:1.3rem;font-weight:900;text-align:center;color:#fff;position:relative;z-index:2}
.section-title.edit-section{position:absolute;left:10px;top:50%;transform:translateY(-50%);background:var(--orange);color:#000;border:none;border-radius:6px;padding:4px 8px;font-size:0.8rem;cursor:pointer;display:none}
body.admin.section-title.edit-section{display:block}

.products-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:10px;background:var(--blue2);position:relative;z-index:2}
.product-card{background:#fff;border-radius:8px;padding:10px;text-align:center;position:relative}
.product-card img{width:100%;height:140px;object-fit:contain;margin-bottom:8px}
.product-name{font-size:0.9rem;height:40px;overflow:hidden;text-align:right;color:#0F1111}
.product-price{color:var(--red);font-weight:900;font-size:1.1rem;text-align:right}
.product-price span{font-size:0.8rem}
.product-old{color:#888;text-decoration:line-through;font-size:0.85rem;text-align:right}
.product-old span{font-size:0.8rem}
.add-cart-btn{background:var(--yellow);border:none;width:100%;padding:8px;border-radius:20px;margin-top:8px;font-weight:700;cursor:pointer;color:#000}
.add-product-in-cat{background:var(--green);color:#fff;border:none;padding:12px;width:95%;margin:10px auto;display:block;border-radius:10px;font-weight:900;cursor:pointer}

.card-admin{position:absolute;top:5px;left:5px;display:flex;gap:4px;z-index:10}
.card-admin button{background:var(--yellow);color:#000;border:none;border-radius:6px;width:28px;height:28px;cursor:pointer;font-size:0.8rem}
.card-admin.del{background:var(--red);color:#fff}
.back-btn{background:var(--blue);color:#fff;border:none;padding:10px 15px;border-radius:8px;margin:10px;cursor:pointer;position:relative;z-index:2}

.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;justify-content:space-around;padding:6px 0;z-index:998}
.nav-item{text-align:center;font-size:0.75rem;color:#333;cursor:pointer;position:relative}
.nav-item i{font-size:1.6rem;display:block;margin-bottom:2px}
.nav-item.active{color:var(--orange)}
.cart-count{position:absolute;top:-5px;right:15px;background:var(--red);color:#fff;border-radius:50%;width:18px;height:18px;font-size:0.7rem;display:flex;align-items:center;justify-content:center;font-weight:900}

#sideMenu{display:none;position:fixed;top:0;right:0;width:300px;height:100%;background:var(--card);z-index:10001;padding:20px;border-left:2px solid var(--orange)}
#sideMenu.show{display:block}
#sideMenu h3{color:var(--orange);margin:15px 0}
#sideMenu button{width:100%;padding:12px;margin:8px 0;border:none;border-radius:8px;background:var(--blue);color:#fff;font-weight:700;cursor:pointer;text-align:right}
.overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#000aa;z-index:10000}
.overlay.show{display:block}

/* نافذة الحساب */
#accountModal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#000a;z-index:100002;align-items:center;justify-content:center}
#accountModal.show{display:flex}
.account-box{background:var(--card);width:90%;max-width:400px;padding:20px;border-radius:15px;color:var(--text);position:relative;z-index:2}
.account-box h2{text-align:center;color:var(--orange);margin-bottom:15px}
.account-tabs{display:flex;gap:5px;margin-bottom:15px}
.account-tabs button{flex:1;padding:10px;border:none;border-radius:8px;background:#ddd;color:#333;font-weight:700;cursor:pointer}
.account-tabs button.active{background:var(--orange);color:#000}
.account-box input{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #ddd;background:var(--bg);color:var(--text)}
.account-box button.submit{width:100%;padding:12px;margin:8px 0;border:none;border-radius:8px;font-weight:700;cursor:pointer;background:var(--green);color:#fff}

#adminPanel{position:fixed;top:0;left:-450px;width:450px;height:100%;background:#232F3E;z-index:99999;overflow-y:auto;padding:20px;border-right:3px solid var(--orange);transition:left 0.4s ease;color:#fff}
#adminPanel.show{left:0}
.admin-toggle{position:fixed;top:50%;left:0;background:var(--orange);color:#000;border:none;padding:15px 8px;border-radius:0 10px 10px 0;font-size:1.5rem;cursor:pointer;z-index:100000;display:none}
.admin-toggle.show{display:block}
.admin-box h2{color:var(--orange);text-align:center;margin-bottom:15px}
.admin-section{border:1px solid #555;padding:15px;border-radius:10px;margin:15px 0}
.admin-box input,.admin-box textarea,.admin-box select{width:100%;padding:10px;margin:8px 0;border-radius:8px;border:1px solid var(--orange);background:#131921;color:#fff}
.admin-box button{padding:10px;border:none;border-radius:8px;font-weight:700;cursor:pointer;width:100%;margin:5px 0}
.preview-img{width:80px;height:80px;border-radius:8px;object-fit:cover;margin:5px;border:2px solid var(--orange)}
.color-picker{width:100%;height:40px;border:none;border-radius:8px;cursor:pointer}
.sync-box{background:var(--orange);color:#000;padding:10px;border-radius:8px;text-align:center;font-weight:900;margin:10px 0;font-size:0.9rem}
</style>
</head>
<body>

<div class="overlay-logo" id="overlayLogo"></div>

<div class="top-header">
  <div class="banners">
    <div class="banner" onclick="openBannerCat('offers')">
      <button class="edit-banner" onclick="editBanner('offers');event.stopPropagation()"><i class="fa-solid fa-pen"></i></button>
      <img src="https://cdn-icons-png.flaticon.com/512/2639/2639415.png">
      <p>كل العروض</p>
    </div>
    <div class="banner" onclick="openBannerCat('needs')">
      <button class="edit-banner" onclick="editBanner('needs');event.stopPropagation()"><i class="fa-solid fa-pen"></i></button>
      <img src="https://cdn-icons-png.flaticon.com/512/3081/3081559.png">
      <p>مستلزماتك</p>
    </div>
    <div class="banner" onclick="openBannerCat('bazaar')">
      <button class="edit-banner" onclick="editBanner('bazaar');event.stopPropagation()"><i class="fa-solid fa-pen"></i></button>
      <img src="https://cdn-icons-png.flaticon.com/512/891/891462.png">
      <p>بازار</p>
    </div>
  </div>

  <div class="search-area">
    <div class="search-cam"><i class="fa-solid fa-camera"></i></div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="البحث في Amazon.ae" onkeyup="searchProduct()">
      <div class="search-icon" onclick="searchProduct()"><i class="fa-solid fa-magnifying-glass"></i></div>
    </div>
    <div id="searchResults" class="search-results"></div>
  </div>

  <div class="location-bar">
    <button class="join-prime">الضم إلى برايم</button>
    <div class="location-select"><i class="fa-solid fa-location-dot"></i> التوصيل إلى سعود - الفجيرة...</div>
  </div>
</div>

<div id="mainContent">
  <h2 class="section-title">
    خصومات كبيرة لك
    <button class="edit-section" onclick="toggleAdmin()"><i class="fa-solid fa-pen"></i> تعديل</button>
  </h2>
  <div id="productsGrid" class="products-grid"></div>
</div>

<div id="categoryPage" style="display:none">
  <button class="back-btn" onclick="goHome()"><i class="fa-solid fa-arrow-right"></i> رجوع</button>
  <h2 class="section-title" id="catPageTitle"></h2>
  <button class="add-product-in-cat" style="display:none" id="addProductBtn" onclick="quickAddToCurrentCat()"><i class="fa-solid fa-plus"></i> اضافة منتج لهذا القسم</button>
  <div id="catProductsGrid" class="products-grid" style="background:var(--card)"></div>
</div>

<div class="overlay" id="overlay" onclick="toggleMenu()"></div>
<div id="sideMenu">
  <h3><i class="fa-solid fa-gear"></i> الاعدادات</h3>
  <button onclick="toggleTheme()"><i class="fa-solid fa-circle-half-stroke"></i> الوضع الليلي / النهاري</button>
  <button onclick="window.open('https://wa.me/+971544066811','_blank')"><i class="fa-brands fa-whatsapp"></i> تواصل معنا</button>
</div>

<div class="bottom-nav">
  <div class="nav-item" onclick="toggleMenu()"><i class="fa-solid fa-bars"></i>تصفح</div>
  <div class="nav-item" onclick="checkoutShamCash()"><i class="fa-solid fa-cart-shopping"></i>العربة <span id="cartCount" class="cart-count">0</span></div>
  <div class="nav-item" onclick="openAccount()"><i class="fa-regular fa-user"></i>حسابك</div>
  <div class="nav-item active" onclick="goHome()"><i class="fa-solid fa-house"></i>الرئيسية</div>
</div>

<!-- نافذة الحساب -->
<div id="accountModal">
  <div class="account-box">
    <div class="account-tabs">
      <button id="tabLogin" class="active" onclick="showLogin()">تسجيل دخول</button>
      <button id="tabRegister" onclick="showRegister()">انشاء حساب</button>
    </div>
    <div id="loginForm">
      <input type="text" id="loginUser" placeholder="الايميل او رقم الجوال">
      <input type="password" id="loginPass" placeholder="كلمة السر">
      <button class="submit" onclick="login()">دخول</button>
    </div>
    <div id="registerForm" style="display:none">
      <input type="text" id="regName" placeholder="الاسم">
      <input type="text" id="regUser" placeholder="الايميل او رقم الجوال">
      <input type="password" id="regPass" placeholder="كلمة السر">
      <button class="submit" style="background:var(--orange);color:#000" onclick="register()">تسجيل</button>
    </div>
    <button onclick="closeAccount()" style="background:var(--red);color:#fff;width:100%;padding:10px;border:none;border-radius:8px;margin-top:10px">اغلاق</button>
  </div>
</div>

<button id="adminToggleBtn" class="admin-toggle" onclick="toggleAdminPanel()"><i class="fa-solid fa-chevron-right"></i></button>

<div id="adminPanel">
  <div class="admin-box">
    <h2><i class="fa-solid fa-user-shield"></i> لوحة التحكم</h2>
    <button onclick="closeAdminPanel()" style="background:var(--red)">اغلاق نهائي للوحة</button>

    <div class="sync-box">
      <i class="fa-solid fa-rotate"></i> لنقل البيانات بين الاجهزة<br>
      <button onclick="exportData()" style="background:#fff;color:#000;margin-top:8px">تصدير البيانات</button>
      <input type="file" id="importFile" accept=".json" onchange="importData(event)" style="display:none">
      <button onclick="document.getElementById('importFile').click()" style="background:#fff;color:#000">استيراد البيانات</button>
    </div>

    <div class="admin-section">
      <h3>1. اضافة قسم جديد</h3>
      <input type="text" id="newCatName" placeholder="اسم القسم">
      <label>صورة القسم:</label>
      <input type="file" id="newCatImgFile" accept="image/*" onchange="previewFile(this,'catPreview')">
      <img id="catPreview" class="preview-img" style="display:none">
      <input type="text" id="newCatId" placeholder="id بالانجليزي: phones">
      <button onclick="addCategory()" style="background:var(--green)">اضافة قسم</button>
    </div>

    <div class="admin-section">
      <h3>2. اضافة منتج لقسم</h3>
      <select id="productCat"></select>
      <input type="text" id="productName" placeholder="اسم المنتج">
      <input type="number" id="productPrice" placeholder="السعر الجديد بالدرهم">
      <input type="number" id="productOldPrice" placeholder="السعر القديم بالدرهم">
      <label>صورة المنتج:</label>
      <input type="file" id="productImgFile" accept="image/*" onchange="previewFile(this,'prodPreview')">
      <img id="prodPreview" class="preview-img" style="display:none">
      <button onclick="addProduct()" style="background:var(--green)">اضافة منتج</button>
    </div>

    <div class="admin-section">
      <h3>3. الخلفية والصورة الشفافة</h3>
      <label>لون الخلفية:</label>
      <input type="color" id="bgColor" class="color-picker" value="#EAEDED" onchange="changeBgColor(this.value)">
      <label>صورة خلفية:</label>
      <input type="file" id="bgFile" accept="image/*" onchange="changeBackground(this)">
      <img id="bgPreview" class="preview-img" style="display:none">
      <button onclick="removeBg()" style="background:var(--red)">حذف الخلفية</button>
      <hr style="margin:10px 0;border-color:#555">
      <label>صورة شفافة فوق الموقع:</label>
      <input type="file" id="overlayLogoFile" accept="image/*" onchange="changeOverlayLogo(this)">
      <img id="overlayPreview" class="preview-img" style="display:none">
      <button onclick="removeOverlay()" style="background:var(--red)">حذف الصورة الشفافة</button>
    </div>

    <button onclick="saveData()" style="background:var(--green)">حفظ كل التغييرات</button>
    <button onclick="resetData()" style="background:var(--red)">ارجاع الافتراضي</button>
  </div>
</div>

<script>
let cart = [];
let siteData = JSON.parse(localStorage.getItem('oskarSiteDataV129')) || getDefaultData();
let users = JSON.parse(localStorage.getItem('oskarUsersV129')) || [];
let currentUser = JSON.parse(localStorage.getItem('oskarCurrentUserV129')) || null;
let tempCatImg = '';
let tempProdImg = '';
let adminActive = localStorage.getItem('adminActiveV129') === 'true';
let allProducts = [];
let currentCat = 'all';
const SECRET_CODE = "oskad0099";

function getDefaultData(){
  return {
    bodyBg: "",
    bgColor: "#EAEDED",
    overlayLogo: "",
    banners: {
      offers:{name:"كل العروض", img:"https://cdn-icons-png.flaticon.com/512/2639/2639415.png"},
      needs:{name:"مستلزماتك", img:"https://cdn-icons-png.flaticon.com/512/3081/3081559.png"},
      bazaar:{name:"بازار", img:"https://cdn-icons-png.flaticon.com/512/891/891462.png"}
    },
    categories: [
      {id:"offers", name:"كل العروض", img:"https://images.unsplash.com/photo-1607082348824-0a96f2a4b9da?w=400"},
      {id:"needs", name:"مستلزماتك", img:"https://images.unsplash.com/photo-1441986300917-64674bd600d8?w=400"},
      {id:"bazaar", name:"بازار", img:"https://images.unsplash.com/photo-1555529669-e4c140fd0b4e?w=400"}
    ],
    products: {
      offers:[
        {name:"سماعات لاسلكية", price:499, oldPrice:959, img:"https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400"},
        {name:"سماعات d", price:119, oldPrice:200, img:"https://images.unsplash.com/photo-1484704849700-f032a568e944?w=400"},
        {name:"نظارة شمسية", price:499, oldPrice:860, img:"https://images.unsplash.com/photo-1511499767150-a48a237f0083?w=400"},
        {name:"مكنسة روبوت", price:698.99, oldPrice:1299, img:"https://images.unsplash.com/photo-1558317374-067fb5f30001?w=400"}
      ],
      needs:[], bazaar:[]
    }
  }
}

function previewFile(input, previewId){
  const file = input.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    document.getElementById(previewId).src = e.target.result;
    document.getElementById(previewId).style.display = 'block';
    if(previewId=='catPreview') tempCatImg = e.target.result;
    if(previewId=='prodPreview') tempProdImg = e.target.result;
  }
  reader.readAsDataURL(file);
}

function changeBackground(input){
  const file = input.files[0];if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    siteData.bodyBg = `url('${e.target.result}')`;
    document.getElementById('bgPreview').src = e.target.result;
    document.getElementById('bgPreview').style.display = 'block';
    document.body.style.setProperty('--bodyBg', siteData.bodyBg);
    saveData();alert('تم تغيير الخلفية')
  }
  reader.readAsDataURL(file);
}

function changeOverlayLogo(input){
  const file = input.files[0];if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    siteData.overlayLogo = e.target.result;
    document.getElementById('overlayPreview').src = e.target.result;
    document.getElementById('overlayPreview').style.display = 'block';
    document.getElementById('overlayLogo').style.setProperty('--overlayLogo', `url('${e.target.result}')`);
    document.getElementById('overlayLogo').style.display = 'block';
    saveData();alert('تم اضافة الصورة الشفافة')
  }
  reader.readAsDataURL(file);
}

function removeOverlay(){
  siteData.overlayLogo = "";
  document.getElementById('overlayLogo').style.display = 'none';
  document.getElementById('overlayPreview').style.display = 'none';
  saveData();alert('تم حذف الصورة الشفافة')
}

function changeBgColor(color){
  siteData.bgColor = color;
  document.body.style.backgroundColor = color;
  document.body.style.setProperty('--bg', color);
  saveData();
}

function removeBg(){
  siteData.bodyBg = "";
  document.body.style.setProperty('--bodyBg', '');
  document.getElementById('bgPreview').style.display = 'none';
  saveData();alert('تم حذف صورة الخلفية')
}

function buildAllProducts(){
  allProducts = [];
  for(let catId in siteData.products){
    siteData.products[catId].forEach(p=>{
      allProducts.push({...p, catId:catId});
    });
  }
}

function renderAllProducts(){
  let html = '';
  siteData.products.offers.forEach((p,i)=>{
    html += `<div class="product-card">
      <div class="card-admin" style="display:${adminActive?'flex':'none'}">
        <button onclick="editProduct('offers',${i})"><i class="fa-solid fa-pen"></i></button>
        <button onclick="changeProdImage('offers',${i})"><i class="fa-solid fa-image"></i></button>
        <button class="del" onclick="deleteProduct('offers',${i})"><i class="fa-solid fa-trash"></i></button>
      </div>
      <img src="${p.img}">
      <div class="product-name">${p.name}</div>
      <div class="product-price">${parseFloat(p.price).toLocaleString()}<span> درهم</span></div>
      <div class="product-old">${parseFloat(p.oldPrice).toLocaleString()}<span> درهم</span></div>
      <button class="add-cart-btn" onclick='addToCart(${JSON.stringify(p)})'>اضافة للعربة</button>
    </div>`;
  });
  document.getElementById('productsGrid').innerHTML = html;
}

function openBannerCat(catId){
  currentCat = catId;
  document.getElementById('mainContent').style.display = 'none';
  document.getElementById('categoryPage').style.display = 'block';
  document.getElementById('addProductBtn').style.display = adminActive? 'block' : 'none';
  let cat = siteData.categories.find(c=>c.id==catId);
  document.getElementById('catPageTitle').innerText = cat.name;

  let html = '';
  siteData.products[catId].forEach((p,i)=>{
    html += `<div class="product-card">
      <div class="card-admin" style="display:${adminActive?'flex':'none'}">
        <button onclick="editProduct('${catId}',${i})"><i class="fa-solid fa-pen"></i></button>
        <button onclick="changeProdImage('${catId}',${i})"><i class="fa-solid fa-image"></i></button>
        <button class="del" onclick="deleteProduct('${catId}',${i})"><i class="fa-solid fa-trash"></i></button>

      <button class="add-cart-btn" onclick='addToCart(${JSON.stringify(p)})'>اضافة للعربة</button>
    </div>`;
  });
  document.getElementById('catProductsGrid').innerHTML = html || '<p style="text-align:center;padding:20px;color:#000">لا توجد منتجات</p>';
}

function editBanner(id){
  let newName = prompt('الاسم الجديد للايقونة:', siteData.banners[id].name);
  if(newName) siteData.banners[id].name = newName;
  let fileInput = document.createElement('input');
  fileInput.type = 'file'; fileInput.accept = 'image/*';
  fileInput.onchange = function(e){
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = function(ev){
      siteData.banners[id].img = ev.target.result;
      saveData();location.reload();
    };
    reader.readAsDataURL(file);
  };
  fileInput.click();
}

function addToCart(item){
  if(!currentUser){alert('يجب تسجيل الدخول لاضافة للسلة');openAccount();return}
  let existing = cart.find(p=>p.name==item.name);if(existing) existing.qty++;else cart.push({...item, qty:1});updateCart();
}
function updateCart(){document.getElementById('cartCount').innerText = cart.reduce((a,b)=>a+b.qty,0);}

function checkoutShamCash(){
  if(!currentUser){alert('يجب تسجيل الدخول للشراء');openAccount();return}
  if(cart.length == 0){ alert("السلة فارغة"); return; }
  let total = cart.reduce((a,b)=>a + parseFloat(b.price) * b.qty, 0);
  let message = `مرحبا مركز اوسكار التقني\nالعميل: ${currentUser.name}\nاريد الدفع عبر شام كاش\n`;
  cart.forEach((item,i)=>{message += `${i+1}. ${item.name} x ${item.qty}\n`});
  message += `\nالمجموع: ${total.toLocaleString()} درهم`;
  window.open(`https://wa.me/+971544066811?text=${encodeURIComponent(message)}`, '_blank');
}

    toggleAdmin();box.style.display='none';document.getElementById('searchInput').value='';return
  }
  if(val.length < 2){box.style.display='none';return}
  let results = allProducts.filter(p=>p.name.toLowerCase().includes(val)).slice(0,8);
