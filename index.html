<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مركز اوسكار التقني</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--bg:#EAEDED;--card:#fff;--blue:#232F3E;--orange:#FF9900;--green:#067D62; --red:#B12704; --yellow:#FFD814; --text:#0F1111}
body.dark{--bg:#131921;--card:#232F3E;--text:#fff}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
body{background:var(--bodyBg, var(--bg)) center/cover fixed;color:var(--text);padding-bottom:70px}

.top-header{background:var(--blue);padding:10px;color:#fff;position:sticky;top:0;z-index:999}
.brand-row{display:flex;justify-content:space-between;align-items:center}
.brand-name{font-weight:900;font-size:1.4rem;color:var(--orange)}
.whatsapp-top{background:#25D366;color:#fff;border:none;padding:8px 12px;border-radius:8px;font-weight:700;cursor:pointer;font-size:0.9rem}
.search-area{display:flex;gap:0;padding:10px 0 0 0;position:relative}
.search-icon{background:var(--orange);padding:0 6px;display:flex;align-items:center;border-radius:0 8px 8px 0;font-size:0.9rem;cursor:pointer;width:32px;justify-content:center}
.search-area input{flex:1;padding:9px;border:none;outline:none;font-size:0.95rem;border-radius:8px 0 0 8px}
.search-results{position:absolute;top:50px;left:10px;right:10px;background:var(--card);border-radius:8px;max-height:400px;overflow-y:auto;display:none;z-index:1000;box-shadow:0 4px 10px #0003}
.search-item{display:flex;gap:10px;padding:10px;cursor:pointer;border-bottom:1px solid #ddd;color:var(--text)}

.section-title{background:var(--card);padding:15px;font-size:1.3rem;font-weight:900;text-align:center;border-bottom:1px solid #ddd;color:var(--text)}

.categories-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:10px;background:var(--card)}
.cat-card{background:var(--bg);border:1px solid #ddd;border-radius:10px;padding:10px;text-align:center;position:relative;cursor:pointer}
body.dark.cat-card{border-color:#444}
.cat-card img{width:100%;height:100px;object-fit:cover;border-radius:8px;margin-bottom:8px}
.cat-card h3{font-size:1rem;color:var(--text)}

.products-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:10px;background:var(--card)}
.product-card{background:var(--bg);border:1px solid #ddd;border-radius:8px;padding:10px;text-align:center;position:relative}
body.dark.product-card{border-color:#444}
.product-card img{width:100%;height:140px;object-fit:contain;margin-bottom:8px}
.product-name{font-size:0.9rem;height:40px;overflow:hidden;text-align:right;color:var(--text)}
.product-price{color:var(--red);font-weight:900;font-size:1.1rem;text-align:right}
.product-old{color:#888;text-decoration:line-through;font-size:0.85rem;text-align:right}
.add-cart-btn{background:var(--yellow);border:none;width:100%;padding:8px;border-radius:20px;margin-top:8px;font-weight:700;cursor:pointer;color:#000}
.add-product-in-cat{background:var(--green);color:#fff;border:none;padding:12px;width:95%;margin:10px auto;display:block;border-radius:10px;font-weight:900;cursor:pointer}

.card-admin{position:absolute;top:5px;left:5px;display:flex;gap:4px;z-index:10}
.card-admin button{background:var(--yellow);color:#000;border:none;border-radius:6px;width:28px;height:28px;cursor:pointer;font-size:0.8rem}
.card-admin.del{background:var(--red);color:#fff}
.back-btn{background:var(--blue);color:#fff;border:none;padding:10px 15px;border-radius:8px;margin:10px;cursor:pointer}

.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid #ddd;display:flex;justify-content:space-around;padding:8px 0;z-index:998}
.nav-item{text-align:center;font-size:0.8rem;color:var(--text);cursor:pointer;position:relative}
.nav-item i{font-size:1.5rem;display:block;margin-bottom:3px}
.cart-count{position:absolute;top:-5px;right:15px;background:var(--red);color:#fff;border-radius:50%;width:18px;height:18px;font-size:0.7rem;display:flex;align-items:center;justify-content:center;font-weight:900}

#sideMenu{display:none;position:fixed;top:0;right:0;width:300px;height:100%;background:var(--card);z-index:10001;padding:20px;border-left:2px solid var(--orange)}
#sideMenu.show{display:block}
#sideMenu h3{color:var(--orange);margin:15px 0}
#sideMenu button{width:100%;padding:12px;margin:8px 0;border:none;border-radius:8px;background:var(--blue);color:#fff;font-weight:700;cursor:pointer;text-align:right}
.overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#000aa;z-index:10000}
.overlay.show{display:block}

/* نافذة الحساب */
#accountModal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#000a;z-index:100002;align-items:center;justify-content:center}
#accountModal.show{display:flex}
.account-box{background:var(--card);width:90%;max-width:400px;padding:20px;border-radius:15px;color:var(--text);max-height:90vh;overflow-y:auto}
.account-box h2{text-align:center;color:var(--orange);margin-bottom:15px}
.account-tabs{display:flex;gap:5px;margin-bottom:15px}
.account-tabs button{flex:1;padding:10px;border:none;border-radius:8px;background:#ddd;color:#333;font-weight:700;cursor:pointer}
.account-tabs button.active{background:var(--orange);color:#000}
.account-box input,.account-box textarea{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:1px solid #ddd;background:var(--bg);color:var(--text)}
.account-box button.submit{width:100%;padding:12px;margin:8px 0;border:none;border-radius:8px;font-weight:700;cursor:pointer;background:var(--green);color:#fff}
.user-info{text-align:center;padding:15px;background:var(--bg);border-radius:10px;margin-bottom:15px}
.user-info h3{color:var(--orange);margin-bottom:5px}

/* نافذة الدفع */
#checkoutModal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#000a;z-index:100003;align-items:center;justify-content:center}
#checkoutModal.show{display:flex}
.checkout-box{background:var(--card);width:90%;max-width:500px;padding:20px;border-radius:15px;color:var(--text);max-height:90vh;overflow-y:auto}
.checkout-box h2{text-align:center;color:var(--orange);margin-bottom:15px}
.address-section{border:1px solid #ddd;padding:15px;border-radius:10px;margin:15px 0;background:var(--bg)}
.address-section h3{color:var(--blue);margin-bottom:10px;font-size:1rem}
.location-btn{background:var(--blue);color:#fff;border:none;padding:10px;border-radius:8px;width:100%;margin:8px 0;cursor:pointer;font-weight:700}
.location-btn i{margin-left:5px}
.payment-section{text-align:center;padding:15px;border:2px dashed var(--orange);border-radius:10px;margin:15px 0}
.payment-section img{width:180px;height:180px;margin:10px auto;display:block;border-radius:8px;background:#fff;padding:10px}
.payment-section p{font-weight:700;color:var(--red)}
.cart-summary{max-height:200px;overflow-y:auto;margin:10px 0;border:1px solid #ddd;border-radius:8px;padding:10px}

#adminPanel{position:fixed;top:0;left:-450px;width:450px;height:100%;background:#232F3E;z-index:99999;overflow-y:auto;padding:20px;border-right:3px solid var(--orange);transition:left 0.4s ease;color:#fff}
#adminPanel.show{left:0}
.admin-toggle{position:fixed;top:50%;left:0;background:var(--orange);color:#000;border:none;padding:15px 8px;border-radius:0 10px 10px 0;font-size:1.5rem;cursor:pointer;z-index:100000;display:none}
.admin-toggle.show{display:block}
.admin-box h2{color:var(--orange);text-align:center;margin-bottom:15px}
.admin-section{border:1px solid #555;padding:15px;border-radius:10px;margin:15px 0}
.admin-box input,.admin-box textarea,.admin-box select{width:100%;padding:10px;margin:8px 0;border-radius:8px;border:1px solid var(--orange);background:#131921;color:#fff}
.admin-box button{padding:10px;border:none;border-radius:8px;font-weight:700;cursor:pointer;width:100%;margin:5px 0}
.preview-img{width:80px;height:80px;border-radius:8px;object-fit:cover;margin:5px;border:2px solid var(--orange)}
.color-picker{width:100%;height:40px;border:none;border-radius:8px;cursor:pointer}
</style>
</head>
<body>

<div class="top-header">
  <div class="brand-row">
    <div class="brand-name"><i class="fa-solid fa-microchip"></i> مركز اوسكار التقني</div>
    <button class="whatsapp-top" onclick="window.open('https://wa.me/+971544066811','_blank')"><i class="fa-brands fa-whatsapp"></i> تواصل</button>
  </div>
  <div class="search-area">
    <div class="search-icon" onclick="searchProduct()"><i class="fa-solid fa-magnifying-glass"></i></div>
    <input type="text" id="searchInput" placeholder="البحث في مركز اوسكار" onkeyup="searchProduct()">
    <div id="searchResults" class="search-results"></div>
  </div>
</div>

<div id="mainContent">
  <h2 class="section-title">الاقسام</h2>
  <div id="categoriesGrid" class="categories-grid"></div>

  <h2 class="section-title">خصومات كبيرة لك</h2>
  <div id="productsGrid" class="products-grid"></div>
</div>

<div id="categoryPage" style="display:none">
  <button class="back-btn" onclick="goHome()"><i class="fa-solid fa-arrow-right"></i> رجوع للاقسام</button>
  <h2 class="section-title" id="catPageTitle"></h2>
  <button class="add-product-in-cat" style="display:none" id="addProductBtn" onclick="quickAddToCurrentCat()"><i class="fa-solid fa-plus"></i> اضافة منتج لهذا القسم</button>
  <div id="catProductsGrid" class="products-grid"></div>
</div>

<div class="overlay" id="overlay" onclick="toggleMenu()"></div>
<div id="sideMenu">
  <h3><i class="fa-solid fa-gear"></i> الاعدادات</h3>
  <button onclick="toggleTheme()"><i class="fa-solid fa-circle-half-stroke"></i> الوضع الليلي / النهاري</button>
</div>

<div class="bottom-nav">
  <div class="nav-item" onclick="toggleMenu()"><i class="fa-solid fa-bars"></i>تصفح</div>
  <div class="nav-item" onclick="checkLoginBeforeCart()"><i class="fa-solid fa-cart-shopping"></i>العربة <span id="cartCount" class="cart-count">0</span></div>
  <div class="nav-item" onclick="openAccount()"><i class="fa-solid fa-user"></i><span id="accountText">حسابك</span></div>
  <div class="nav-item" onclick="goHome()"><i class="fa-solid fa-house"></i>الرئيسية</div>
</div>

<!-- نافذة الحساب -->
<div id="accountModal">
  <div class="account-box">
    <div id="loggedInView" style="display:none">
      <div class="user-info">
        <h3 id="userNameDisplay"></h3>
        <p id="userPhoneDisplay"></p>
      </div>
      <button onclick="logout()" style="background:var(--red);color:#fff;width:100%;padding:12px;border:none;border-radius:8px;font-weight:700">تسجيل خروج</button>
      <button onclick="closeAccount()" style="background:#888;color:#fff;width:100%;padding:12px;border:none;border-radius:8px;font-weight:700;margin-top:10px">اغلاق</button>
    </div>

    <div id="guestView">
      <div class="account-tabs">
        <button id="tabLogin" class="active" onclick="showLogin()">تسجيل دخول</button>
        <button id="tabRegister" onclick="showRegister()">انشاء حساب جديد</button>
      </div>
      <div id="loginForm">
        <input type="text" id="loginUser" placeholder="الايميل او رقم الجوال">
        <input type="password" id="loginPass" placeholder="كلمة السر">
        <button class="submit" onclick="login()">دخول</button>
      </div>
      <div id="registerForm" style="display:none">
        <input type="text" id="regName" placeholder="الاسم الكامل">
        <input type="text" id="regUser" placeholder="الايميل او رقم الجوال">
        <input type="password" id="regPass" placeholder="كلمة السر">
        <button class="submit" style="background:var(--orange);color:#000" onclick="register()">انشاء حساب</button>
      </div>
      <button onclick="closeAccount()" style="background:var(--red);color:#fff;width:100%;padding:10px;border:none;border-radius:8px;margin-top:10px">اغلاق</button>
    </div>
  </div>
</div>

<!-- نافذة الدفع والعنوان -->
<div id="checkoutModal">
  <div class="checkout-box">
    <h2><i class="fa-solid fa-truck"></i> اتمام الطلب</h2>
    <div class="cart-summary" id="checkoutCartSummary"></div>
    <h3 style="text-align:center;color:var(--red)" id="checkoutTotal"></h3>

    <div class="address-section">
      <h3><i class="fa-solid fa-location-dot"></i> عنوان التوصيل</h3>
      <input type="text" id="customerName" placeholder="الاسم الكامل *">
      <input type="text" id="customerPhone" placeholder="رقم الجوال *">
      <input type="text" id="customerCity" placeholder="المدينة *">
      <input type="text" id="customerArea" placeholder="المنطقة / الحي *">
      <textarea id="customerAddress" rows="3" placeholder="العنوان التفصيلي: الشارع - رقم البيت - علامة مميزة *"></textarea>

      <button class="location-btn" onclick="getLocation()"><i class="fa-solid fa-location-crosshairs"></i> تحديد موقعي الحالي</button>
      <input type="text" id="customerLocationLink" placeholder="رابط الموقع من الخرائط" readonly>
      <textarea id="customerLocationDetails" rows="2" placeholder="تفاصيل اضافية للموقع: بجانب مسجد - محل معروف"></textarea>
    </div>

    <div class="payment-section">
      <h3><i class="fa-solid fa-qrcode"></i> الدفع عبر شام كاش</h3>
      <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=SHAMCASH_OSKAR_0099" alt="باركود شام كاش">
      <p>امسح الباركود للدفع</p>
      <p style="font-size:0.85rem;color:#666">بعد الدفع اضغط ارسال الطلب عبر واتساب</p>
    </div>

    <button onclick="sendOrderWhatsApp()" class="submit" style="background:var(--green)"><i class="fa-brands fa-whatsapp"></i> ارسال الطلب عبر واتساب</button>
    <button onclick="closeCheckout()" style="background:var(--red)">الغاء</button>
  </div>
</div>

<button id="adminToggleBtn" class="admin-toggle" onclick="toggleAdminPanel()"><i class="fa-solid fa-chevron-right"></i></button>

<div id="adminPanel">
  <div class="admin-box">
    <h2><i class="fa-solid fa-user-shield"></i> لوحة التحكم</h2>
    <button onclick="closeAdminPanel()" style="background:var(--red)">اغلاق نهائي للوحة</button>

    <div class="admin-section">
      <h3>1. اضافة قسم جديد</h3>
      <input type="text" id="newCatName" placeholder="اسم القسم">
      <label>صورة القسم:</label>
      <input type="file" id="newCatImgFile" accept="image/*" onchange="previewFile(this,'catPreview')">
      <img id="catPreview" class="preview-img" style="display:none">
      <input type="text" id="newCatId" placeholder="id بالانجليزي: phones">
      <button onclick="addCategory()" style="background:var(--green)">اضافة قسم</button>
    </div>

    <div class="admin-section">
      <h3>2. اضافة منتج لقسم</h3>
      <select id="productCat"></select>
      <input type="text" id="productName" placeholder="اسم المنتج">
      <input type="number" id="productPrice" placeholder="السعر الجديد بالليرة">
      <input type="number" id="productOldPrice" placeholder="السعر القديم بالليرة">
      <label>صورة المنتج:</label>
      <input type="file" id="productImgFile" accept="image/*" onchange="previewFile(this,'prodPreview')">
      <img id="prodPreview" class="preview-img" style="display:none">
      <button onclick="addProduct()" style="background:var(--green)">اضافة منتج</button>
    </div>

    <div class="admin-section">
      <h3>3. تغيير الخلفية البيضاء للموقع</h3>
      <label>لون الخلفية:</label>
      <input type="color" id="bgColor" class="color-picker" value="#EAEDED" onchange="changeBgColor(this.value)">
      <label>او صورة خلفية:</label>
      <input type="file" id="bgFile" accept="image/*" onchange="changeBackground(this)">
      <img id="bgPreview" class="preview-img" style="display:none">
      <button onclick="removeBg()" style="background:var(--red)">حذف الصورة</button>
    </div>

    <div class="admin-section">
      <h3>4. النسخ الاحتياطي</h3>
      <button onclick="exportData()" style="background:var(--blue)">تصدير البيانات</button>
      <input type="file" id="importFile" accept=".json" onchange="importData(event)" style="display:none">
      <button onclick="document.getElementById('importFile').click()" style="background:var(--yellow);color:#000">استيراد البيانات</button>
    </div>

    <button onclick="saveData()" style="background:var(--green)">حفظ كل التغييرات</button>
    <button onclick="resetData()" style="background:var(--red)">ارجاع الافتراضي</button>
  </div>
</div>

<script>
let cart = [];
let siteData = JSON.parse(localStorage.getItem('oskarSiteDataV137')) || getDefaultData();
let users = JSON.parse(localStorage.getItem('oskarUsersV137')) || [];
let currentUser = JSON.parse(localStorage.getItem('oskarCurrentUserV137')) || null;
let tempCatImg = '';
let tempProdImg = '';
let adminActive = localStorage.getItem('adminActiveV137') === 'true';
let allProducts = [];
let currentCat = 'all';
const SECRET_CODE = "oskad0099";

function getDefaultData(){
  return {
    bodyBg: "",
    bgColor: "#EAEDED",
    categories: [
      {id:"phones", name:"جوالات", img:"https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=400"},
      {id:"accessories", name:"اكسسوارات", img:"https://images.unsplash.com/photo-1498049794561-7780e7231661?w=400"}
    ],
    products: {phones: [], accessories: []}
  }
}

function previewFile(input, previewId){
  const file = input.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    document.getElementById(previewId).src = e.target.result;
    document.getElementById(previewId).style.display = 'block';
    if(previewId=='catPreview') tempCatImg = e.target.result;
    if(previewId=='prodPreview') tempProdImg = e.target.result;
  }
  reader.readAsDataURL(file);
}

function changeBackground(input){
  const file = input.files[0];if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    siteData.bodyBg = `url('${e.target.result}')`;
    document.getElementById('bgPreview').src = e.target.result;
    document.getElementById('bgPreview').style.display = 'block';
    document.body.style.setProperty('--bodyBg', siteData.bodyBg);
    saveData();alert('تم تغيير الخلفية')
  }
  reader.readAsDataURL(file);
}

function changeBgColor(color){
  siteData.bgColor = color;
  document.body.style.backgroundColor = color;
  document.body.style.setProperty('--bg', color);
  saveData();
}

function removeBg(){
  siteData.bodyBg = "";
  document.body.style.setProperty('--bodyBg', '');
  document.getElementById('bgPreview').style.display = 'none';
  saveData();alert('تم حذف صورة الخلفية')
}

function buildAllProducts(){
  allProducts = [];
  for(let catId in siteData.products){
    siteData.products[catId].forEach(p=>{
      allProducts.push({...p, catId:catId});
    });
  }
}

function renderCategories(){
  let html = '';
  siteData.categories.forEach(cat=>{
    html += `<div class="cat-card" onclick="openCategory('${cat.id}')">
      <div class="card-admin" style="display:${adminActive?'flex':'none'}">
        <button onclick="editCategory('${cat.id}');event.stopPropagation()"><i class="fa-solid fa-pen"></i></button>
        <button onclick="changeCatImage('${cat.id}');event.stopPropagation()"><i class="fa-solid fa-image"></i></button>
        <button class="del" onclick="deleteCategory('${cat.id}');event.stopPropagation()"><i class="fa-solid fa-trash"></i></button>
      </div>
      <img src="${cat.img}"><h3>${cat.name}</h3></div>`;
  });
  document.getElementById('categoriesGrid').innerHTML = html;

  let select = document.getElementById('productCat');
  select.innerHTML = '';
  siteData.categories.forEach(cat=>{
    select.innerHTML += `<option value="${cat.id}">${cat.name}</option>`;
  });
}

function renderAllProducts(){
  let html = '';
  for(let catId in siteData.products){
    siteData.products[catId].slice(0,4).forEach((p,i)=>{
      html += productCardHTML(p, catId, i);
    });
  }
  document.getElementById('productsGrid').innerHTML = html || '<p style="text-align:center;padding:20px;grid-column:1/3">لا توجد منتجات بعد</p>';
}

function productCardHTML(p, catId, i){
  return `<div class="product-card">
    <div class="card-admin" style="display:${adminActive?'flex':'none'}">
      <button onclick="editProduct('${catId}',${i})"><i class="fa-solid fa-pen"></i></button>
      <button onclick="changeProdImage('${catId}',${i})"><i class="fa-solid fa-image"></i></button>
      <button class="del" onclick="deleteProduct('${catId}',${i})"><i class="fa-solid fa-trash"></i></button>
    </div>
    <img src="${p.img}">
    <div class="product-name">${p.name}</div>
    <div class="product-price">${parseInt(p.price).toLocaleString()} ل.س</div>
    <div class="product-old">${parseInt(p.oldPrice).toLocaleString()} ل.س</div>
    <button class="add-cart-btn" onclick='addToCart(${JSON.stringify(p)})'>اضافة للعربة</button>
  </div>`;
}

function openCategory(catId){
  currentCat = catId;
  document.getElementById('mainContent').style.display = 'none';
  document.getElementById('categoryPage').style.display = 'block';
  document.getElementById('addProductBtn').style.display = adminActive? 'block' : 'none';
  let cat = siteData.categories.find(c=>c.id==catId);
  document.getElementById('catPageTitle').innerText = cat.name;

  let html = '';
  siteData.products[catId].forEach((p,i)=>{
    html += productCardHTML(p, catId, i);
  });
  document.getElementById('catProductsGrid').innerHTML = html || '<p style="text-align:center;padding:20px">لا توجد منتجات في هذا القسم</p>';
}

      let lat = position.coords.latitude;
      let lng = position.coords.longitude;
      let link = `https://www.google.com/maps?q=${lat},${lng}`;
      document.getElementById('customerLocationLink').value = link;
      alert('تم تحديد الموقع بنجاح');
    }, function(){

    });

  }
}

function openCheckout(){
  if(cart.length == 0){ alert("السلة فارغة"); return; }
  document.getElementById('checkoutModal').classList.add('show');
  let html = ''; let total = 0;
  cart.forEach((item,i)=>{
    html += `<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #ddd">
      <span>${item.name} x ${item.qty}</span>
      <span>${(parseInt(item.price)*item.qty).toLocaleString()} ل.س</span>
    </div>`;
    total += parseInt(item.price)*item.qty;
  });
  document.getElementById('checkoutCartSummary').innerHTML = html;
  document.getElementById('checkoutTotal').innerText = 'المجموع: ' + total.toLocaleString() + ' ل.س';
  if(currentUser){
    document.getElementById('customerName').value = currentUser.name;
    document.getElementById('customerPhone').value = currentUser.user;
  }
}

function register(){
  let name=document.getElementById('regName').value.trim();
  let user=document.getElementById('regUser').value.trim();
  let pass=document.getElementById('regPass').value;
  if(!name||!user||!pass){alert('كمل البيانات');return}
  if(users.find(u=>u.user==user)){alert('هذا الحساب موجود بالفعل');return}
  users.push({name,user,pass});
  localStorage.setItem('oskarUsersV137',JSON.stringify(users));
  alert('تم انشاء الحساب بنجاح');
  showLogin();
}

function login(){
  let user=document.getElementById('loginUser').value.trim();
  let pass=document.getElementById('loginPass').value;
  let u = users.find(u=>u.user==user && u.pass==pass);
  if(!u){alert('البيانات خاطئة');return}
  currentUser=u;
  localStorage.setItem('oskarCurrentUserV137',JSON.stringify(u));
  document.getElementById('accountText').innerText=u.name;
  closeAccount();alert('اهلا '+u.name);
}

function logout(){

}

function searchProduct(){
  let val = document.getElementById('searchInput').value.toLowerCase();
  let box = document.getElementById('searchResults');
  if(val === SECRET_CODE){
    adminActive =!adminActive;
    localStorage.setItem('adminActiveV137', adminActive);
    if(adminActive){
      document.getElementById('adminToggleBtn').classList.add('show');
      document.getElementById('adminPanel').classList.add('show');
    }else{
      document.getElementById('adminToggleBtn').classList.remove('show');
      document.getElementById('adminPanel').classList.remove('show');
    }
    renderAll();box.style.display='none';document.getElementById('searchInput').value='';
    return
  }
  if(val.length < 2){box.style.display='none';return}
  let results = allProducts.filter(p=>p.name.toLowerCase().includes(val)).slice(0,8);
  box.innerHTML = '';
  results.forEach(p=>{box.innerHTML += `<div class="search-item" onclick="openCategory('${p.catId}')"><img src="${p.img}" width="40">${p.name}</div>`});
  box.style.display = results.length? 'block' : 'none';
}
